<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ERP Produção – Central PCP</title>
<style>
:root{--lime:#CDFF00;--limeD:#708C00;--limeL:#F3FFCC;--dark:#1C1E1A;--bg:#F5F6F2;--bd:#D6DAD0;--tx:#1C1E1A;--tx2:#686E64;--okL:#D6F0E0;--warn:#E6A800;--warnL:#FFF3CD;--err:#DC3545;--errL:#FFE4E6}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.hd{background:var(--dark);color:var(--lime);display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:5px solid var(--lime);flex-wrap:wrap;position:sticky;top:0;z-index:3}
.hd .logo{height:24px;width:auto}
.hd .t{font-size:20px;font-weight:600;margin-right:14px}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{background:transparent;border:1px solid #4a4d45;color:#ddd;padding:7px 13px;border-radius:8px;cursor:pointer}
.nav button.on{background:var(--lime);color:var(--dark);border-color:var(--lime);font-weight:600}
.hd .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.wrap{padding:16px 20px;max-width:1400px;margin:0 auto}
.btn{border-radius:9px;border:0;background:var(--lime);color:var(--dark);font-weight:600;cursor:pointer;padding:9px 16px;font-size:14.5px}
.btn:hover{filter:brightness(.94)}.btn:disabled{background:var(--bd);color:var(--tx2);cursor:not-allowed}
.btn.sec{background:#fff;border:2px solid var(--dark)}
.btn.big{padding:13px 20px;font-size:16px}
.in,.sel{height:38px;border:1px solid var(--bd);border-radius:7px;background:#fff;padding:0 10px}
textarea.in{height:auto;min-height:70px;padding:8px 10px;width:100%}
.in:focus,.sel:focus{outline:none;border:2px solid var(--limeD)}
.lbl{font-size:12px;color:var(--tx2);margin:8px 0 3px;display:block}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:12px}
.filters .f{display:flex;flex-direction:column}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:2px solid var(--bd);border-radius:10px;padding:8px 12px}
.kpi b{font-size:24px;display:block}.kpi span{font-size:12px;color:var(--tx2)}
.kpi.e{background:var(--errL);border-color:var(--err)}.kpi.w{background:var(--warnL);border-color:var(--warn)}
table{width:100%;border-collapse:collapse;background:#fff;font-size:13.5px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--tx2);text-align:left;padding:8px;border-bottom:1px solid var(--bd);background:#fafbf8;position:sticky;top:0}
td{padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--limeL)}
tr.dup td{background:var(--errL)}
.num{text-align:right}
.tw{border:1px solid var(--bd);border-radius:10px;overflow:auto;max-height:calc(100vh - 330px);min-height:120px}
.chip{font-size:11.5px;padding:3px 9px;border-radius:12px;background:var(--bg);white-space:nowrap}
.chip.Validado{background:var(--okL)}.chip.Corrigido{background:var(--limeL);border:1px solid var(--limeD)}.chip.cs{background:var(--warnL)}.chip.Aberta{background:var(--lime)}
.muted{color:var(--tx2);font-size:13px}
.conf{display:grid;grid-template-columns:1fr 1.1fr;gap:16px}
.box{border:1px solid var(--bd);border-radius:10px;padding:14px 16px;background:#fff}
.box.ro{background:#ECEEE8}
.box h4{margin:0 0 10px;font-size:16px;display:flex;justify-content:space-between}
.box h4 small{font-weight:400;color:var(--tx2);font-size:12px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:14px}.kv .k{color:var(--tx2)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2 .in,.g2 .sel{width:100%}
.chg{border:3px solid var(--limeD)!important}
.warn{background:var(--warnL);border:1px solid var(--warn);border-radius:8px;padding:10px;font-size:13.5px;margin-top:8px}
.info{background:var(--limeL);border:1px solid var(--limeD);border-radius:8px;padding:10px 12px;font-size:14px}
.empty{padding:26px;text-align:center;color:var(--tx2)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.cards .box h4{font-size:15px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--dark);color:var(--lime);padding:11px 18px;border-radius:9px;font-size:14.5px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.conf{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="config.js" onerror="void 0"></script>
<script>
"use strict";
/* ======================================================================
   ERP Produção – Central PCP (versão HTML, sem servidor)
   Importa os arquivos LANCAMENTOS_*.csv e PARADAS_*.csv exportados pelos
   aparelhos, guarda a BASE BRUTA (nunca alterada), a BASE TRATADA (corrigida)
   e o HISTÓRICO de alterações. Exporta tudo em CSV para o Excel.
   Os dados ficam neste navegador (IndexedDB) + backup JSON na pasta.
   ====================================================================== */
const CAD = {"maq": [], "mat": [], "mot": []};
const ACOND = ["BAG","FARDO","PALETE","SACARIA"];
const $=s=>document.querySelector(s);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pad(n,w=2){return String(n).padStart(w,"0")}
function isoD(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function isoDT(d){return isoD(d)+"T"+pad(d.getHours())+":"+pad(d.getMinutes())}
function today(){return isoD(new Date())}
function addDays(iso,n){const d=new Date(iso+"T12:00");d.setDate(d.getDate()+n);return isoD(d)}
function nowIso(){return isoDT(new Date())}
function br(iso){if(!iso)return"";const[a,b]=iso.split("T");const[y,m,d]=a.split("-");return d+"/"+m+"/"+y+(b?" "+b:"")}
function brc(iso){if(!iso)return"";const[a,b]=iso.split("T");const[y,m,d]=a.split("-");return d+"/"+m+(b?" "+b:"")}
function hh(iso){return iso?iso.slice(11,16):""}
function fromBr(s){s=String(s||"").trim();const m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{2}):(\d{2}))?/);if(!m)return s;return m[3]+"-"+m[2]+"-"+m[1]+(m[4]?"T"+m[4]+":"+m[5]:"")}
function num(s){const v=parseFloat(String(s??"").replace(/\./g,"").replace(",","."));return isNaN(v)?0:v}
function kg(n){return Number(n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}
function opts(list,sel,ph){return (ph!==undefined?`<option value="">${esc(ph)}</option>`:"")+list.map(v=>`<option${v==sel?" selected":""}>${esc(v)}</option>`).join("")}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),3200)}

/* ---------------- servidor ---------------- */
const KEYC="erp-producao-pcp-google";
function lerCfg(){try{return JSON.parse(localStorage.getItem(KEYC))||{}}catch(e){return {}}}
function gravarCfg(){try{localStorage.setItem(KEYC,JSON.stringify(P.cfg))}catch(e){}}
let P={cfg:Object.assign({api:window.ERP_API||"",senha:"",nome:""},lerCfg()),bruta:{},trat:{},hist:[],par:{},ordens:[],planilha:"",carregadoEm:"",carregando:false,erro:""};
if(!P.cfg.api)P.cfg.api=window.ERP_API||"";
function salvar(){gravarCfg()}
async function api(body,ms=25000){const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),ms);
  try{const r=await fetch(P.cfg.api,{method:"POST",body:JSON.stringify(Object.assign({k:P.cfg.senha},body)),signal:ctl.signal});const j=await r.json();if(!j.ok)throw new Error(j.erro||"Erro");return j}
  catch(e){if(e.name==="AbortError")throw new Error("Sem resposta do servidor");throw e}finally{clearTimeout(t)}}
async function carregar(silencioso){if(!P.cfg.senha||P.carregando)return;P.carregando=true;if(!silencioso)render();
  try{const f=UI.f;const j=await api({a:"pcp",de:f.de,ate:f.ate,q:f.ordem.trim()});
    const st={};j.ordens.forEach(o=>st[o.Ordem]=o.Status);P.stOrd=st;
    P.trat={};j.trat.concat(j.pedidos||[]).forEach(t=>{P.trat[t.ID]=Object.assign({},t,{StatusTratado:t.StatusPCP,DataValidacao:t.ValidadoEm,StatusOrdem:st[t.Ordem]==="Encerrada"?"Encerrada":(st[t.Ordem]||"")})});
    P.bruta={};j.bruta.forEach(b=>{P.bruta[b.ID]=Object.assign({},b,{Arquivo:"recebido em "+br(b.RecebidoEm)})});
    P.hist=j.hist;P.log=j.log||[];if(j.cad)P.cfg.cad=j.cad;P.par={};j.par.forEach(p=>P.par[p.ID]=p);P.ordens=j.ordens;P.planilha=j.planilha;P.carregadoEm=nowIso();P.erro=""}
  catch(e){P.erro=e.message;if(/negado/i.test(e.message)){P.cfg.senha="";salvar()}toast("Erro: "+e.message)}
  finally{P.carregando=false;suave()}}
setInterval(()=>{if(["painel","ordens","pedidos","paradas","log"].includes(UI.tela)&&!document.hidden)carregar(true)},60000);
/* ---------------- estado da tela ---------------- */
let UI={tela:"painel",f:{de:addDays(today(),-7),ate:today(),maq:"",st:"Todos",ordem:""},reg:null,cf:{}};
const TRAT=()=>Object.values(P.trat);

/* ---------------- importação ---------------- */
function parseCsv(txt){txt=txt.replace(/^﻿/,"");const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c=='"'){if(txt[i+1]=='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c=='"')q=true;else if(c==';'){row.push(cur);cur=""}else if(c=='\n'){row.push(cur.replace(/\r$/,""));rows.push(row);row=[];cur=""}else cur+=c}
  if(cur||row.length){row.push(cur.replace(/\r$/,""));rows.push(row)}
  const h=rows.shift()||[];return rows.filter(r=>r.length>1).map(r=>Object.fromEntries(h.map((k,i)=>[k.trim(),r[i]??""])))}
function importarTexto(nome,txt){
  const rows=parseCsv(txt);let novos=0,atual=0;
  if(/^LANCAMENTOS_/i.test(nome)||(rows[0]&&"PesoKg" in rows[0])){
    rows.forEach(r=>{if(!r.ID)return;const b={ID:r.ID,Ordem:r.Ordem,DataProducao:fromBr(r.DataProducao),Turno:r.Turno,Maquina:r.Maquina,Material:r.Material,HoraInicio:fromBr(r.HoraInicio),HoraFim:fromBr(r.HoraFim),
      DuracaoMin:+r.DuracaoMin||0,PesoKg:num(r.PesoKg),Quantidade:r.Quantidade,Acondicionamento:r.Acondicionamento,Observacao:r.Observacao,Operador:r.Operador,StatusOrdem:r.StatusOrdem,PedidoCorrecao:r.PedidoCorrecao,Aparelho:r.Aparelho,LancadoEm:fromBr(r.LancadoEm),Arquivo:nome};
      const ex=P.bruta[b.ID];
      if(!ex){P.bruta[b.ID]=b;P.trat[b.ID]=Object.assign({},b,{StatusTratado:"Em conferência",ValidadoPor:"",DataValidacao:""});novos++}
      else{let mud=false;/* base bruta: dados nunca mudam; só status da ordem e pedido do operador */
        if(b.StatusOrdem&&b.StatusOrdem!==ex.StatusOrdem){ex.StatusOrdem=b.StatusOrdem;P.trat[b.ID].StatusOrdem=b.StatusOrdem;mud=true}
        if(b.PedidoCorrecao&&b.PedidoCorrecao!==ex.PedidoCorrecao){ex.PedidoCorrecao=b.PedidoCorrecao;P.trat[b.ID].PedidoCorrecao=b.PedidoCorrecao;if(P.trat[b.ID].StatusTratado==="Validado")P.trat[b.ID].StatusTratado="Em conferência";mud=true}
        if(mud)atual++}});
  }else if(/^PARADAS_/i.test(nome)||(rows[0]&&"Motivo" in rows[0])){
    rows.forEach(r=>{if(!r.ID)return;if(!P.par[r.ID]){P.par[r.ID]={ID:r.ID,Ordem:r.Ordem,Maquina:r.Maquina,Motivo:r.Motivo,Tipo:r.Tipo,DataProducao:fromBr(r.DataProducao),Inicio:fromBr(r.Inicio),Fim:fromBr(r.Fim),DuracaoMin:+r.DuracaoMin||0,Operador:r.Operador,Observacao:r.Observacao,Aparelho:r.Aparelho,LancadoEm:fromBr(r.LancadoEm),Arquivo:nome};novos++}});
  }else return {erro:true};
  if(!P.arquivos.includes(nome))P.arquivos.push(nome);
  return {novos,atual};
}
async function importarArquivos(files){let n=0,a=0,ign=0,err=0;
  for(const f of files){if(!/\.csv$/i.test(f.name)){ign++;continue}const r=importarTexto(f.name,await f.text());if(r.erro)err++;else{n+=r.novos;a+=r.atual}}
  salvar();toast(`Importado: ${n} registro(s) novo(s), ${a} atualizado(s)${err?`, ${err} arquivo(s) não reconhecido(s)`:""}.`);render()}

/* ---------------- pasta (File System Access) ---------------- */
async function hGet(){return await dbGet("pasta")}
async function pastaPerm(h){if(!h)return false;try{let p=await h.queryPermission({mode:"readwrite"});if(p!=="granted")p=await h.requestPermission({mode:"readwrite"});return p==="granted"}catch(e){return false}}
async function gravar(nome,conteudo,tipo){const h=await hGet();
  if(h&&await pastaPerm(h)){try{const fh=await h.getFileHandle(nome,{create:true});const w=await fh.createWritable();await w.write(new Blob([conteudo],{type:tipo}));await w.close();return "pasta"}catch(e){console.warn(e)}}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([conteudo],{type:tipo+";charset=utf-8"}));a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);return "downloads"}
function csvCell(v){v=String(v??"");return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function csv(rows,cols,fmt){return "﻿"+cols.join(";")+"\r\n"+rows.map(r=>cols.map(c=>csvCell(fmt?fmt(c,r[c]):r[c])).join(";")).join("\r\n")+"\r\n"}
function fmtCell(c,v){if(typeof v==="number"&&/Kg$/.test(c))return String(v).replace(".",",");if(typeof v==="string"&&/^\d{4}-\d{2}-\d{2}/.test(v))return br(v);return v}

/* ---------------- telas ---------------- */
const NAV=[["painel","Painel"],["ordens","Ordens"],["pedidos","Pedidos de correção"],["paradas","Paradas"],["log","Registro de ações"],["dados","Planilha e acesso"]];
function header(){const ped=pedidos().length;
  return `<div class="hd"><img class="logo" src="logo.png" alt="Ambipar" onerror="this.remove()"><div class="t">Central PCP</div><div class="nav">${NAV.map(([k,n])=>`<button class="${UI.tela==k||(UI.tela=="conf"&&k=="painel")||(UI.tela=="hist"&&k=="painel")?"on":""}" data-tela="${k}">${n}${k=="pedidos"&&ped?` (${ped})`:""}</button>`).join("")}</div>
  <div class="r"><span style="color:#cfd3c6;font-size:12.5px">${P.carregando?"Atualizando…":P.carregadoEm?"Atualizado às "+hh(P.carregadoEm):""}</span><button class="btn" data-act="atualizar">Atualizar</button></div></div>`}
function pedidos(){return TRAT().filter(t=>t.PedidoCorrecao&&t.StatusTratado!=="Validado")}
function linhas(){const f=UI.f;const q=f.ordem.trim().toUpperCase();
  let base=q?TRAT().filter(t=>t.Ordem.toUpperCase().includes(q)):TRAT().filter(t=>t.DataProducao>=f.de&&t.DataProducao<=f.ate);
  const idx={};base.forEach(t=>{const k1=t.Ordem+"|"+t.HoraInicio,k2=t.Maquina+"|"+t.HoraInicio+"|"+t.PesoKg;idx[k1]=(idx[k1]||0)+1;idx[k2]=(idx[k2]||0)+1});
  base=base.map(t=>Object.assign({},t,{Dup:Math.max(idx[t.Ordem+"|"+t.HoraInicio],idx[t.Maquina+"|"+t.HoraInicio+"|"+t.PesoKg])}));
  return {all:base,rows:base.filter(t=>(!f.maq||t.Maquina==f.maq)&&(f.st=="Todos"||t.StatusTratado==f.st)).sort((a,b)=>b.HoraInicio.localeCompare(a.HoraInicio))}}
function chip(s){return `<span class="chip ${s=="Em conferência"?"":esc(s)}">${esc(s)}</span>`}

function tela(){
  if(!P.cfg.nome||!P.cfg.senha)return `<div class="hd"><img class="logo" src="logo.png" alt="Ambipar" onerror="this.remove()"><div class="t">Central PCP</div></div><div class="wrap"><div class="box" style="max-width:560px"><h4>Entrar na Central PCP</h4>
    <span class="lbl">Seu nome (fica registrado no histórico de correções)</span><input class="in" id="nome" style="width:100%" value="${esc(P.cfg.nome)}" placeholder="Seu nome">
    <span class="lbl">Senha da Central PCP (aba CONFIG da planilha)</span><input class="in" id="senha" type="password" style="width:100%" autocomplete="off">
    <span class="lbl">Endereço do servidor</span><input class="in" id="apiUrl" style="width:100%;font-size:13px" value="${esc(P.cfg.api)}" placeholder="https://script.google.com/macros/s/…/exec">
    <p style="margin-top:14px"><button class="btn big" data-act="entrarPcp">Entrar</button></p>${P.erro?`<p class="warn">${esc(P.erro)}</p>`:""}</div></div>`;
  switch(UI.tela){
  case "painel":{
    const {all,rows}=linhas();const f=UI.f;const maqs=[...new Set(TRAT().map(t=>t.Maquina))].sort();
    UI.confD??=(()=>{let d=addDays(today(),-1);if(new Date(d+"T12:00").getDay()===0)d=addDays(d,-1);return d})();
    return header()+`<div class="wrap"><div class="box" style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px;border-left:5px solid var(--limeD)">
      <div style="flex:1;min-width:220px"><h4 style="margin:0 0 4px">Conferência da produção</h4><span class="muted">Lista do que foi lançado no dia, para checagem manual (padrão: dia anterior).</span></div>
      <div class="f"><span class="lbl">Dia</span><input class="in" type="date" id="confD" value="${UI.confD}"></div>
      <button class="btn" data-act="confExcel">Baixar planilha (Excel)</button><button class="btn sec" data-act="confResumo">Imprimir em 1 folha</button><button class="btn sec" data-act="confImprimir">Imprimir detalhado (hora a hora)</button></div>
      <div class="filters">
      <div class="f"><span class="lbl">De</span><input class="in" type="date" data-ff="de" value="${f.de}"></div>
      <div class="f"><span class="lbl">Até</span><input class="in" type="date" data-ff="ate" value="${f.ate}"></div>
      <div class="f"><span class="lbl">Máquina</span><select class="sel" data-ff="maq">${opts(maqs,f.maq,"Todas")}</select></div>
      <div class="f"><span class="lbl">Status</span><select class="sel" data-ff="st">${opts(["Todos","Em conferência","Corrigido","Validado"],f.st)}</select></div>
      <div class="f"><span class="lbl">Nº da ordem (todo o histórico)</span><input class="in" id="fordem" value="${esc(f.ordem)}" placeholder="ex.: 000123"></div>
      ${f.ordem?`<button class="btn sec" data-act="limparBusca">Limpar busca</button>`:""}</div>
    <div class="kpis"><div class="kpi"><b>${all.length}</b><span>Horas lançadas ${f.ordem?"na busca":"no período"}</span></div>
      <div class="kpi"><b>${all.filter(t=>t.StatusTratado=="Em conferência").length}</b><span>Aguardando conferência</span></div>
      <div class="kpi e"><b>${all.filter(t=>t.Dup>1).length}</b><span>Possíveis duplicidades</span></div>
      <div class="kpi"><b>${Math.round(all.reduce((s,t)=>s+t.PesoKg,0)).toLocaleString("pt-BR")} kg</b><span>Total ${f.ordem?"da busca":"no período"}</span></div>
      <div class="kpi w"><b>${pedidos().length}</b><span>Pedidos de correção</span></div></div>
    <div class="tw"><table><thead><tr><th>Ordem</th><th>Hora</th><th>Máquina</th><th>Material</th><th class="num">Peso (kg)</th><th>Qtd / acond.</th><th>Operador</th><th>Status</th></tr></thead><tbody>
    ${P.carregando&&!rows.length?`<tr><td colspan="8" class="empty">Carregando…</td></tr>`:rows.length?rows.map(t=>`<tr class="click${t.Dup>1?" dup":""}" data-reg="${esc(t.ID)}"><td><b>${esc(t.Ordem)}</b></td><td>${brc(t.HoraInicio)}–${hh(t.HoraFim)}</td><td>${esc(t.Maquina)}</td><td>${esc(t.Material)}</td><td class="num">${kg(t.PesoKg)}</td><td>${esc(t.Quantidade)} ${esc(t.Acondicionamento)}</td><td>${esc(t.Operador)}</td><td>${t.PedidoCorrecao&&t.StatusTratado!=="Validado"?`<span class="chip cs">Correção pedida</span>`:chip(t.StatusTratado)}</td></tr>`).join("")
      :`<tr><td colspan="8" class="empty">Nenhum lançamento neste filtro.</td></tr>`}
    </tbody></table></div><p class="muted">Linha vermelha = possível duplicidade (mesma hora lançada duas vezes na ordem, ou mesma máquina, hora e peso). Clique numa linha para conferir.</p></div>`}
  case "ordens":{

const n2=v=>(Number(v)||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});

/* ---------------- Excel (.xlsx) sem biblioteca: zip "store" + XML ---------------- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zip(files){const enc=new TextEncoder();const parts=[],cent=[];let off=0;
  const u16=v=>[v&255,(v>>8)&255],u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
  files.forEach(([name,txt])=>{const nb=enc.encode(name),db=enc.encode(txt),cr=crc32(db);
    const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(cr),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0)]);
    parts.push(lh,nb,db);cent.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(cr),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
    off+=lh.length+nb.length+db.length});
  const cs=cent.reduce((s,a)=>s+a.length,0);const end=new Uint8Array([0x50,0x4b,5,6,0,0,0,0,...u16(files.length),...u16(files.length),...u32(cs),...u32(off),0,0]);
  return new Blob([...parts,...cent,end],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})}
const xesc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,"");
function colL(i){let s="";i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s}
/* cols: [{h, w, t:"s"|"d"|"tm"|"n0"|"n1"|"i"}]; rows: arrays de valores (d = "aaaa-mm-dd", tm = "hh:mm") */

    if(t==="d")return `<c r="${ref}" s="${sx}"><v>${serD(v)}</v></c>`;if(t==="tm")return `<c r="${ref}" s="${sx}"><v>${serT(v)}</v></c>`;
    if(t==="n0"||t==="n1"||t==="i"||t==="h1"||t==="g")return `<c r="${ref}" s="${sx}"><v>${Number(v)}</v></c>`;
    return `<c r="${ref}" s="${sx}" t="inlineStr"><is><t xml:space="preserve">${xesc(v)}</t></is></c>`};

      const par=P.length?`<h3>Paradas</h3><table><thead><tr><th>Máquina</th><th>Motivo</th><th>Início</th><th>Fim</th><th class=n>Min</th><th>Operador</th><th>Obs.</th></tr></thead><tbody>${P.map(x=>`<tr><td>${esc(x.Maquina)}</td><td>${esc(x.Motivo)}</td><td>${hm(x.Inicio)}</td><td>${hm(x.Fim)}</td><td class=n>${esc(x.DuracaoMin)}</td><td>${esc(x.Operador)}</td><td>${esc(x.Observacao||"")}</td></tr>`).join("")}</tbody></table>`:"";
      w.document.open();w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Conferência ${br(d)}</title><style>
        body{font-family:Arial,sans-serif;font-size:11px;color:#111;margin:18px}.top{display:flex;align-items:center;gap:14px;border-bottom:3px solid #111;padding-bottom:8px}
        .top img{height:26px;filter:invert(1)}h1{font-size:18px;margin:0}h3{font-size:13px;margin:16px 0 4px}h3 span{font-weight:400;color:#444}
        table{width:100%;border-collapse:collapse}th,td{border:1px solid #999;padding:4px 5px;text-align:left;vertical-align:top}th{background:#eee;font-size:10px}
        .n{text-align:right}.ck{font-size:15px;text-align:center;width:18px}.w{min-width:70px}tr{page-break-inside:avoid}
        .res{margin-top:10px;font-size:13px}.ass{display:flex;gap:40px;margin-top:36px}.ass div{flex:1;border-top:1px solid #111;padding-top:4px}
        @media print{.np{display:none}}</style></head><body>
        <div class="np" style="margin-bottom:10px"><button onclick="print()" style="font-size:14px;padding:6px 14px">Imprimir</button></div>
        <div class="top"><img src="${logo}" onerror="this.remove()"><div><h1>Conferência da produção — ${br(d)}</h1><div>${fh(hrs(L))} h · ${L.length} lançamento(s) · <b>${n2(tot)} kg</b> · ${esc(txtAcond(porAcond(L)))} · gerado em ${br(nowIso().slice(0,16))} por ${esc(P_nome())}</div></div></div>
        ${L.length?blocos:"<p>Nenhum lançamento neste dia.</p>"}${par}
        <h3>Totais do dia</h3><table style="width:auto;min-width:60%"><thead><tr><th>Acondicionamento</th><th class=n>Quantidade</th><th class=n>Peso total (kg)</th><th class=n>Horas</th><th>Qtd conferida</th><th>Peso conferido (kg)</th></tr></thead><tbody>
          ${(()=>{const a=porAcond(L);return Object.keys(a).sort().map(k=>`<tr><td>${esc(k)}</td><td class=n><b>${a[k].q.toLocaleString("pt-BR")}</b></td><td class=n>${n2(a[k].kg)}</td><td class=n>${fh(a[k].h)}</td><td class=w></td><td class=w></td></tr>`).join("")})()}
          <tr><td><b>TOTAL</b></td><td class=n>—</td><td class=n><b>${n2(tot)}</b></td><td class=n><b>${fh(hrs(L))}</b></td><td class=w></td><td class=w></td></tr></tbody></table>
        <h3>Por máquina</h3><table style="width:auto;min-width:60%"><thead><tr><th>Máquina</th><th class=n>Horas</th><th class=n>Peso total (kg)</th><th>Quantidade</th><th>Peso conferido (kg)</th></tr></thead><tbody>
          ${Object.keys(g).sort().map(m=>`<tr><td>${esc(m)}</td><td class=n>${fh(hrs(g[m]))}</td><td class=n>${n2(g[m].reduce((s,t)=>s+(Number(t.PesoKg)||0),0))}</td><td>${esc(txtAcond(porAcond(g[m])))}</td><td class=w></td></tr>`).join("")}</tbody></table>
        <div class="ass"><div>Conferido por</div><div>Data / hora</div><div>Visto do PCP</div></div>
        <script>setTimeout(()=>print(),700)<\/script></body></html>`);w.document.close()}
    catch(e){w.close();toast("Erro: "+e.message)}},
  async entrarPcp(){const n=$("#nome").value.trim(),k=$("#senha").value.trim(),u=$("#apiUrl").value.trim();if(!n||!k||!u){toast("Preencha nome, senha e endereço.");return}
    P.cfg.nome=n;P.cfg.senha=k;P.cfg.api=u;P.erro="";salvar();await carregar(false)},
  sairPcp(){P.cfg.senha="";salvar();P.trat={};P.bruta={}},
  atualizar(){return carregar(false)},
  limparBusca(){UI.f.ordem="";carregar(false)},
  async salvarCorr(){const r=P.trat[UI.reg],c=UI.cf;const pesoAnt=String(r.PesoKg).replace(".",",");
    const mud=[["PesoKg",pesoAnt,c.peso],["Quantidade",String(r.Quantidade??""),c.qtd],["Maquina",r.Maquina,c.maq],["Material",r.Material,c.mat],["Turno",r.Turno,c.turno],["Acondicionamento",r.Acondicionamento,c.acond],["Equipes",String(r.Equipes||""),c.eq.split(/[,;]+/).map(x=>x.trim()).filter(Boolean).join(", ")]].filter(([,a,b])=>String(a)!=String(b));
    if(!mud.length){toast("Nenhuma alteração feita.");return}
    if(!c.motivo.trim()){toast("Informe o motivo da correção.");return}
    if(num(c.peso)<=0){toast("Peso inválido.");return}
    try{const j=await api({a:"corrigir",id:r.ID,mud:mud.map(([k,,v])=>[k,k==="PesoKg"?String(num(v)):v]),motivo:c.motivo.trim(),resp:P.cfg.nome});
      UI.cf={};toast(j.alteracoes+" campo(s) corrigido(s) e registrado(s) no histórico.");await carregar(true)}catch(e){toast("Erro: "+e.message)}},
  async validar(){const r=P.trat[UI.reg];try{await api({a:"validar",id:r.ID,resp:P.cfg.nome});toast("Hora validada.");UI.tela="painel";await carregar(true)}catch(e){toast("Erro: "+e.message)}},
};

/* ---------------- eventos ---------------- */
let rendering=false;
function render(){if(rendering)return;rendering=true;try{$("#app").innerHTML=tela()}finally{rendering=false}}
function chave(el){return el.id||JSON.stringify(el.dataset)}
function suave(){const a=document.activeElement,k=a&&chave(a),s=a&&a.selectionStart;render();const el=[...document.querySelectorAll("input,textarea,select")].find(x=>chave(x)===k);if(el){el.focus();try{if(s!=null)el.setSelectionRange(s,s)}catch(_){}}}
document.addEventListener("click",async e=>{const t=e.target.closest("[data-tela],[data-act],[data-reg],[data-ordem]");if(!t||t.disabled||t.tagName==="A")return;
  if(t.dataset.tela){UI.tela=t.dataset.tela;if(UI.tela!=="hist"&&UI.tela!=="conf")UI.cf={}}
  else if(t.dataset.act){await ACT[t.dataset.act]()}
  else if(t.dataset.reg){UI.reg=t.dataset.reg;UI.cf={};UI.tela="conf"}
  else if(t.dataset.ordem){UI.f.ordem=t.dataset.ordem;UI.tela="painel";render();carregar(false);return}
  render()});
function campo(e){const t=e.target;
  let re=e.type==="change";
  if(t.dataset.c!==undefined)UI.cf[t.dataset.c]=t.value;
  else if(t.dataset.ff!==undefined){UI.f[t.dataset.ff]=t.value;re=true;if(t.dataset.ff==="de"||t.dataset.ff==="ate"){if(e.type==="change")carregar(true)}}
  else if(t.id==="confD"){UI.confD=t.value}
  else if(t.id==="dxDe"){UI.dxDe=t.value;if(UI.dxAte<t.value){UI.dxAte=t.value;const a=$("#dxAte");if(a)a.value=t.value}}
  else if(t.id==="dxAte"){UI.dxAte=t.value}
  else if(t.id==="logq"){UI.logq=t.value;clearTimeout(window._lq);window._lq=setTimeout(()=>{suave();setTimeout(()=>{const x=$("#logq");if(x){x.focus();x.setSelectionRange(x.value.length,x.value.length)}},0)},350)}
  else if(t.id==="fordem"){UI.f.ordem=t.value;clearTimeout(window._bq);window._bq=setTimeout(()=>carregar(true),600)}
  else return;
  re?render():suave()}
document.addEventListener("input",campo);document.addEventListener("change",campo);
render();carregar(false);
</script>
</body>
