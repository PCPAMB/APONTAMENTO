<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Central</title>
<style>
:root{--lime:#CDFF00;--limeD:#708C00;--limeL:#F3FFCC;--dark:#1C1E1A;--bg:#F5F6F2;--bd:#D6DAD0;--tx:#1C1E1A;--tx2:#686E64;--okL:#D6F0E0;--warn:#E6A800;--warnL:#FFF3CD;--err:#DC3545;--errL:#FFE4E6}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.hd{background:var(--dark);color:var(--lime);display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:5px solid var(--lime);flex-wrap:wrap;position:sticky;top:0;z-index:3}
.hd .t{font-size:20px;font-weight:600;margin-right:14px}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{background:transparent;border:1px solid #4a4d45;color:#ddd;padding:7px 13px;border-radius:8px;cursor:pointer}
.nav button.on{background:var(--lime);color:var(--dark);border-color:var(--lime);font-weight:600}
.hd .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.wrap{padding:16px 20px;max-width:1400px;margin:0 auto}
.btn{border-radius:9px;border:0;background:var(--lime);color:var(--dark);font-weight:600;cursor:pointer;padding:9px 16px;font-size:14.5px}
.btn:hover{filter:brightness(.94)}.btn:disabled{background:var(--bd);color:var(--tx2);cursor:not-allowed}
.btn.sec{background:#fff;border:2px solid var(--dark)}
.btn.big{padding:13px 20px;font-size:16px}
.in,.sel{height:38px;border:1px solid var(--bd);border-radius:7px;background:#fff;padding:0 10px}
textarea.in{height:auto;min-height:70px;padding:8px 10px;width:100%}
.in:focus,.sel:focus{outline:none;border:2px solid var(--limeD)}
.lbl{font-size:12px;color:var(--tx2);margin:8px 0 3px;display:block}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:12px}
.filters .f{display:flex;flex-direction:column}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:2px solid var(--bd);border-radius:10px;padding:8px 12px}
.kpi b{font-size:24px;display:block}.kpi span{font-size:12px;color:var(--tx2)}
.kpi.e{background:var(--errL);border-color:var(--err)}.kpi.w{background:var(--warnL);border-color:var(--warn)}
table{width:100%;border-collapse:collapse;background:#fff;font-size:13.5px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--tx2);text-align:left;padding:8px;border-bottom:1px solid var(--bd);background:#fafbf8;position:sticky;top:0}
td{padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--limeL)}
tr.dup td{background:var(--errL)}
.num{text-align:right}
.tw{border:1px solid var(--bd);border-radius:10px;overflow:auto;max-height:calc(100vh - 330px);min-height:120px}
.chip{font-size:11.5px;padding:3px 9px;border-radius:12px;background:var(--bg);white-space:nowrap}
.chip.Validado{background:var(--okL)}.chip.Corrigido{background:var(--limeL);border:1px solid var(--limeD)}.chip.cs{background:var(--warnL)}.chip.Aberta{background:var(--lime)}
.muted{color:var(--tx2);font-size:13px}
.conf{display:grid;grid-template-columns:1fr 1.1fr;gap:16px}
.box{border:1px solid var(--bd);border-radius:10px;padding:14px 16px;background:#fff}
.box.ro{background:#ECEEE8}
.box h4{margin:0 0 10px;font-size:16px;display:flex;justify-content:space-between}
.box h4 small{font-weight:400;color:var(--tx2);font-size:12px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:14px}.kv .k{color:var(--tx2)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2 .in,.g2 .sel{width:100%}
.chg{border:3px solid var(--limeD)!important}
.warn{background:var(--warnL);border:1px solid var(--warn);border-radius:8px;padding:10px;font-size:13.5px;margin-top:8px}
.info{background:var(--limeL);border:1px solid var(--limeD);border-radius:8px;padding:10px 12px;font-size:14px}
.empty{padding:26px;text-align:center;color:var(--tx2)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.cards .box h4{font-size:15px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--dark);color:var(--lime);padding:11px 18px;border-radius:9px;font-size:14.5px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.conf{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
/* ======================================================================
   ERP Produção – Central PCP (versão HTML, sem servidor)
   Importa os arquivos LANCAMENTOS_*.csv e PARADAS_*.csv exportados pelos
   aparelhos, guarda a BASE BRUTA (nunca alterada), a BASE TRATADA (corrigida)
   e o HISTÓRICO de alterações. Exporta tudo em CSV para o Excel.
   Os dados ficam neste navegador (IndexedDB) + backup JSON na pasta.
   ====================================================================== */
const CAD = {"maq": [], "mat": [], "mot": []};
const ACOND = ["BAG","FARDO","PALETE","SACARIA"];
const $=s=>document.querySelector(s);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pad(n,w=2){return String(n).padStart(w,"0")}
function isoD(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function isoDT(d){return isoD(d)+"T"+pad(d.getHours())+":"+pad(d.getMinutes())}
function today(){return isoD(new Date())}
function addDays(iso,n){const d=new Date(iso+"T12:00");d.setDate(d.getDate()+n);return isoD(d)}
function nowIso(){return isoDT(new Date())}
function br(iso){if(!iso)return"";const[a,b]=iso.split("T");const[y,m,d]=a.split("-");return d+"/"+m+"/"+y+(b?" "+b:"")}
function brc(iso){if(!iso)return"";const[a,b]=iso.split("T");const[y,m,d]=a.split("-");return d+"/"+m+(b?" "+b:"")}
function hh(iso){return iso?iso.slice(11,16):""}
function fromBr(s){s=String(s||"").trim();const m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{2}):(\d{2}))?/);if(!m)return s;return m[3]+"-"+m[2]+"-"+m[1]+(m[4]?"T"+m[4]+":"+m[5]:"")}
function num(s){const v=parseFloat(String(s??"").replace(/\./g,"").replace(",","."));return isNaN(v)?0:v}
function kg(n){return Number(n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}
function opts(list,sel,ph){return (ph!==undefined?`<option value="">${esc(ph)}</option>`:"")+list.map(v=>`<option${v==sel?" selected":""}>${esc(v)}</option>`).join("")}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),3200)}

/* ---------------- armazenamento (IndexedDB) ---------------- */
function db(){return new Promise((res,rej)=>{const r=indexedDB.open("erp-producao-pcp",1);r.onupgradeneeded=()=>{r.result.createObjectStore("s")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function dbGet(k){try{const d=await db();return await new Promise(r=>{const q=d.transaction("s").objectStore("s").get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
async function dbSet(k,v){try{const d=await db();await new Promise((r,j)=>{const t=d.transaction("s","readwrite");t.objectStore("s").put(v,k);t.oncomplete=r;t.onerror=()=>j(t.error)});return true}catch(e){toast("⚠ Não foi possível salvar neste navegador. Exporte as bases.");return false}}
function novo(){return {cfg:{nome:"",pastaNome:""},bruta:{},trat:{},hist:[],par:{},arquivos:[]}}
let P=novo();
let salvando=null;function salvar(){clearTimeout(salvando);salvando=setTimeout(()=>dbSet("estado",P),150)}

/* ---------------- estado da tela ---------------- */
let UI={tela:"painel",f:{de:addDays(today(),-7),ate:today(),maq:"",st:"Todos",ordem:""},reg:null,cf:{},pf:{de:addDays(today(),-7),ate:today()}};
const TRAT=()=>Object.values(P.trat);

/* ---------------- importação ---------------- */
function parseCsv(txt){txt=txt.replace(/^﻿/,"");const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c=='"'){if(txt[i+1]=='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c=='"')q=true;else if(c==';'){row.push(cur);cur=""}else if(c=='\n'){row.push(cur.replace(/\r$/,""));rows.push(row);row=[];cur=""}else cur+=c}
  if(cur||row.length){row.push(cur.replace(/\r$/,""));rows.push(row)}
  const h=rows.shift()||[];return rows.filter(r=>r.length>1).map(r=>Object.fromEntries(h.map((k,i)=>[k.trim(),r[i]??""])))}
function importarTexto(nome,txt){
  const rows=parseCsv(txt);let novos=0,atual=0;
  if(/^LANCAMENTOS_/i.test(nome)||(rows[0]&&"PesoKg" in rows[0])){
    rows.forEach(r=>{if(!r.ID)return;const b={ID:r.ID,Ordem:r.Ordem,DataProducao:fromBr(r.DataProducao),Turno:r.Turno,Maquina:r.Maquina,Material:r.Material,HoraInicio:fromBr(r.HoraInicio),HoraFim:fromBr(r.HoraFim),
      DuracaoMin:+r.DuracaoMin||0,PesoKg:num(r.PesoKg),Quantidade:r.Quantidade,Acondicionamento:r.Acondicionamento,Observacao:r.Observacao,Operador:r.Operador,StatusOrdem:r.StatusOrdem,PedidoCorrecao:r.PedidoCorrecao,Aparelho:r.Aparelho,LancadoEm:fromBr(r.LancadoEm),Arquivo:nome};
      const ex=P.bruta[b.ID];
      if(!ex){P.bruta[b.ID]=b;P.trat[b.ID]=Object.assign({},b,{StatusTratado:"Em conferência",ValidadoPor:"",DataValidacao:""});novos++}
      else{let mud=false;/* base bruta: dados nunca mudam; só status da ordem e pedido do operador */
        if(b.StatusOrdem&&b.StatusOrdem!==ex.StatusOrdem){ex.StatusOrdem=b.StatusOrdem;P.trat[b.ID].StatusOrdem=b.StatusOrdem;mud=true}
        if(b.PedidoCorrecao&&b.PedidoCorrecao!==ex.PedidoCorrecao){ex.PedidoCorrecao=b.PedidoCorrecao;P.trat[b.ID].PedidoCorrecao=b.PedidoCorrecao;if(P.trat[b.ID].StatusTratado==="Validado")P.trat[b.ID].StatusTratado="Em conferência";mud=true}
        if(mud)atual++}});
  }else if(/^PARADAS_/i.test(nome)||(rows[0]&&"Motivo" in rows[0])){
    rows.forEach(r=>{if(!r.ID)return;if(!P.par[r.ID]){P.par[r.ID]={ID:r.ID,Ordem:r.Ordem,Maquina:r.Maquina,Motivo:r.Motivo,Tipo:r.Tipo,DataProducao:fromBr(r.DataProducao),Inicio:fromBr(r.Inicio),Fim:fromBr(r.Fim),DuracaoMin:+r.DuracaoMin||0,Operador:r.Operador,Observacao:r.Observacao,Aparelho:r.Aparelho,LancadoEm:fromBr(r.LancadoEm),Arquivo:nome};novos++}});
  }else return {erro:true};
  if(!P.arquivos.includes(nome))P.arquivos.push(nome);
  return {novos,atual};
}
async function importarArquivos(files){let n=0,a=0,ign=0,err=0;
  for(const f of files){if(!/\.csv$/i.test(f.name)){ign++;continue}const r=importarTexto(f.name,await f.text());if(r.erro)err++;else{n+=r.novos;a+=r.atual}}
  salvar();toast(`Importado: ${n} registro(s) novo(s), ${a} atualizado(s)${err?`, ${err} arquivo(s) não reconhecido(s)`:""}.`);render()}

/* ---------------- pasta (File System Access) ---------------- */
async function hGet(){return await dbGet("pasta")}
async function pastaPerm(h){if(!h)return false;try{let p=await h.queryPermission({mode:"readwrite"});if(p!=="granted")p=await h.requestPermission({mode:"readwrite"});return p==="granted"}catch(e){return false}}
async function gravar(nome,conteudo,tipo){const h=await hGet();
  if(h&&await pastaPerm(h)){try{const fh=await h.getFileHandle(nome,{create:true});const w=await fh.createWritable();await w.write(new Blob([conteudo],{type:tipo}));await w.close();return "pasta"}catch(e){console.warn(e)}}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([conteudo],{type:tipo+";charset=utf-8"}));a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);return "downloads"}
function csvCell(v){v=String(v??"");return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function csv(rows,cols,fmt){return "﻿"+cols.join(";")+"\r\n"+rows.map(r=>cols.map(c=>csvCell(fmt?fmt(c,r[c]):r[c])).join(";")).join("\r\n")+"\r\n"}
function fmtCell(c,v){if(typeof v==="number"&&/Kg$/.test(c))return String(v).replace(".",",");if(typeof v==="string"&&/^\d{4}-\d{2}-\d{2}/.test(v))return br(v);return v}

/* ---------------- telas ---------------- */
const NAV=[["painel","Painel"],["ordens","Ordens"],["pedidos","Pedidos de correção"],["paradas","Paradas"],["dados","Importar / Exportar"]];
function header(){const ped=pedidos().length;
  return `<div class="hd"><div class="t">ERP Central PCP</div><div class="nav">${NAV.map(([k,n])=>`<button class="${UI.tela==k||(UI.tela=="conf"&&k=="painel")||(UI.tela=="hist"&&k=="painel")?"on":""}" data-tela="${k}">${n}${k=="pedidos"&&ped?` (${ped})`:""}</button>`).join("")}</div>
  <div class="r"><button class="btn" data-act="importarPasta">Importar da pasta</button></div></div>`}
function pedidos(){return TRAT().filter(t=>t.PedidoCorrecao&&t.StatusTratado!=="Validado")}
function linhas(){const f=UI.f;const q=f.ordem.trim().toUpperCase();
  let base=q?TRAT().filter(t=>t.Ordem.toUpperCase().includes(q)):TRAT().filter(t=>t.DataProducao>=f.de&&t.DataProducao<=f.ate);
  const idx={};base.forEach(t=>{const k1=t.Ordem+"|"+t.HoraInicio,k2=t.Maquina+"|"+t.HoraInicio+"|"+t.PesoKg;idx[k1]=(idx[k1]||0)+1;idx[k2]=(idx[k2]||0)+1});
  base=base.map(t=>Object.assign({},t,{Dup:Math.max(idx[t.Ordem+"|"+t.HoraInicio],idx[t.Maquina+"|"+t.HoraInicio+"|"+t.PesoKg])}));
  return {all:base,rows:base.filter(t=>(!f.maq||t.Maquina==f.maq)&&(f.st=="Todos"||t.StatusTratado==f.st)).sort((a,b)=>b.HoraInicio.localeCompare(a.HoraInicio))}}
function chip(s){return `<span class="chip ${s=="Em conferência"?"":esc(s)}">${esc(s)}</span>`}

function tela(){
  if(!P.cfg.nome)return header()+`<div class="wrap"><div class="box" style="max-width:520px"><h4>Bem-vindo à Central PCP</h4>
    <p>Informe seu nome. Ele fica registrado no histórico de cada correção e validação.</p><input class="in" id="nome" style="width:100%" placeholder="Seu nome">
    <p style="margin-top:14px"><button class="btn big" data-act="salvarNome">Começar</button></p>
    <p class="muted">Já usava a Central em outro computador? Depois de começar, vá em <b>Importar / Exportar → Restaurar backup</b>.</p></div></div>`;
  switch(UI.tela){
  case "painel":{
    const {all,rows}=linhas();const f=UI.f;const maqs=[...new Set(TRAT().map(t=>t.Maquina))].sort();
    return header()+`<div class="wrap"><div class="filters">
      <div class="f"><span class="lbl">De</span><input class="in" type="date" data-ff="de" value="${f.de}"></div>
      <div class="f"><span class="lbl">Até</span><input class="in" type="date" data-ff="ate" value="${f.ate}"></div>
      <div class="f"><span class="lbl">Máquina</span><select class="sel" data-ff="maq">${opts(maqs,f.maq,"Todas")}</select></div>
      <div class="f"><span class="lbl">Status</span><select class="sel" data-ff="st">${opts(["Todos","Em conferência","Corrigido","Validado"],f.st)}</select></div>
      <div class="f"><span class="lbl">Nº da ordem (todo o histórico)</span><input class="in" id="fordem" value="${esc(f.ordem)}" placeholder="ex.: 000123"></div>
      ${f.ordem?`<button class="btn sec" data-act="limparBusca">Limpar busca</button>`:""}</div>
    <div class="kpis"><div class="kpi"><b>${all.length}</b><span>Horas lançadas ${f.ordem?"na busca":"no período"}</span></div>
      <div class="kpi"><b>${all.filter(t=>t.StatusTratado=="Em conferência").length}</b><span>Aguardando conferência</span></div>
      <div class="kpi e"><b>${all.filter(t=>t.Dup>1).length}</b><span>Possíveis duplicidades</span></div>
      <div class="kpi"><b>${Math.round(all.reduce((s,t)=>s+t.PesoKg,0)).toLocaleString("pt-BR")} kg</b><span>Total ${f.ordem?"da busca":"no período"}</span></div>
      <div class="kpi w"><b>${pedidos().length}</b><span>Pedidos de correção</span></div></div>
    <div class="tw"><table><thead><tr><th>Ordem</th><th>Hora</th><th>Máquina</th><th>Material</th><th class="num">Peso (kg)</th><th>Qtd / acond.</th><th>Operador</th><th>Status</th></tr></thead><tbody>
    ${rows.length?rows.map(t=>`<tr class="click${t.Dup>1?" dup":""}" data-reg="${esc(t.ID)}"><td><b>${esc(t.Ordem)}</b></td><td>${brc(t.HoraInicio)}–${hh(t.HoraFim)}</td><td>${esc(t.Maquina)}</td><td>${esc(t.Material)}</td><td class="num">${kg(t.PesoKg)}</td><td>${esc(t.Quantidade)} ${esc(t.Acondicionamento)}</td><td>${esc(t.Operador)}</td><td>${t.PedidoCorrecao&&t.StatusTratado!=="Validado"?`<span class="chip cs">Correção pedida</span>`:chip(t.StatusTratado)}</td></tr>`).join("")
      :`<tr><td colspan="8" class="empty">${Object.keys(P.bruta).length?"Nada neste filtro.":"Nenhum dado ainda. Clique em <b>Importar da pasta</b> (ou vá em Importar / Exportar) e escolha a pasta com os arquivos exportados pelos aparelhos."}</td></tr>`}
    </tbody></table></div><p class="muted">Linha vermelha = possível duplicidade (mesma hora lançada duas vezes na ordem, ou mesma máquina, hora e peso). Clique numa linha para conferir.</p></div>`}
  case "ordens":{
    const g={};TRAT().filter(t=>t.DataProducao>=UI.f.de&&t.DataProducao<=UI.f.ate).forEach(t=>{const o=g[t.Ordem]||(g[t.Ordem]={Ordem:t.Ordem,Data:t.DataProducao,Turno:t.Turno,Maquina:t.Maquina,Material:t.Material,Operador:t.Operador,St:t.StatusOrdem,h:0,kg:0,val:0});o.h++;o.kg+=t.PesoKg;if(t.StatusTratado=="Validado")o.val++;if(t.StatusOrdem=="Encerrada")o.St="Encerrada"});
    const L=Object.values(g).sort((a,b)=>b.Ordem.localeCompare(a.Ordem));
    return header()+`<div class="wrap"><div class="filters"><div class="f"><span class="lbl">De</span><input class="in" type="date" data-ff="de" value="${UI.f.de}"></div><div class="f"><span class="lbl">Até</span><input class="in" type="date" data-ff="ate" value="${UI.f.ate}"></div></div>
    <div class="tw"><table><thead><tr><th>Ordem</th><th>Data</th><th>Turno</th><th>Máquina</th><th>Material</th><th>Operador</th><th class="num">Horas</th><th class="num">Total (kg)</th><th>Validadas</th><th>Ordem</th></tr></thead><tbody>
    ${L.length?L.map(o=>`<tr class="click" data-ordem="${esc(o.Ordem)}"><td><b>${esc(o.Ordem)}</b></td><td>${br(o.Data)}</td><td>${esc(o.Turno)}</td><td>${esc(o.Maquina)}</td><td>${esc(o.Material)}</td><td>${esc(o.Operador)}</td><td class="num">${o.h}</td><td class="num"><b>${kg(o.kg)}</b></td><td>${o.val}/${o.h}</td><td>${o.St=="Encerrada"?chip("Encerrada"):`<span class="chip Aberta">Aberta</span>`}</td></tr>`).join(""):`<tr><td colspan="10" class="empty">Nenhuma ordem no período.</td></tr>`}
    </tbody></table></div><p class="muted">"Aberta" = o operador ainda não encerrou (ou a exportação do encerramento ainda não chegou). Clique numa ordem para ver as horas.</p></div>`}
  case "conf":{
    const r=P.trat[UI.reg];if(!r){UI.tela="painel";return tela()}const o=P.bruta[r.ID];const c=UI.cf;
    c.peso??=String(r.PesoKg).replace(".",",");c.qtd??=String(r.Quantidade??"");c.maq??=r.Maquina;c.mat??=r.Material;c.turno??=r.Turno;c.acond??=r.Acondicionamento;c.motivo??="";
    const ch=(a,b)=>String(a)!=String(b)?" chg":"";const nh=P.hist.filter(h=>h.ID===r.ID).length;
    const cadP=P.cfg.cad||CAD;const maqs=[...new Set([...cadP.maq,...TRAT().map(t=>t.Maquina)])].sort(),mats=[...new Set([...cadP.mat,...TRAT().map(t=>t.Material)])].sort(),acs=[...new Set([...(cadP.acond||ACOND),r.Acondicionamento])];
    return header()+`<div class="wrap"><p><button class="btn sec" data-tela="painel">← Voltar ao painel</button> &nbsp; <b style="font-size:18px">Conferência · ${esc(r.Ordem)} · ${brc(r.HoraInicio)}–${hh(r.HoraFim)}</b></p>
    <div class="conf"><div class="box ro"><h4>Original · BASE BRUTA <small>só leitura</small></h4><div class="kv">
      <span class="k">Máquina</span><span>${esc(o.Maquina)}</span><span class="k">Material</span><span>${esc(o.Material)}</span>
      <span class="k">Peso</span><b>${kg(o.PesoKg)} kg</b><span class="k">Quantidade</span><span>${esc(o.Quantidade)} ${esc(o.Acondicionamento)}</span>
      <span class="k">Turno</span><span>${esc(o.Turno)}</span><span class="k">Hora</span><span>${br(o.HoraInicio)} – ${hh(o.HoraFim)} (${o.DuracaoMin} min)</span>
      <span class="k">Operador</span><span>${esc(o.Operador)}</span><span class="k">Lançado em</span><span>${br(o.LancadoEm)} · aparelho ${esc(o.Aparelho)}</span>
      <span class="k">Observação</span><span>${esc(o.Observacao)||"—"}</span><span class="k">Arquivo</span><span class="muted">${esc(o.Arquivo)}</span></div>
      ${o.PedidoCorrecao?`<div class="warn">Pedido do operador: ${esc(o.PedidoCorrecao)}</div>`:""}
      <p><button class="btn sec" data-tela="hist">Ver histórico (${nh})</button></p></div>
    <div class="box"><h4>Tratado · BASE TRATADA <small>editável</small></h4><div class="g2">
      <div><span class="lbl">Peso (kg)</span><input class="in${ch(c.peso,String(r.PesoKg).replace(".",","))}" data-c="peso" value="${esc(c.peso)}"></div>
      <div><span class="lbl">Quantidade</span><input class="in${ch(c.qtd,r.Quantidade??"")}" data-c="qtd" value="${esc(c.qtd)}"></div>
      <div><span class="lbl">Máquina</span><select class="sel${ch(c.maq,r.Maquina)}" data-c="maq">${opts(maqs,c.maq)}</select></div>
      <div><span class="lbl">Material</span><select class="sel${ch(c.mat,r.Material)}" data-c="mat">${opts(mats,c.mat)}</select></div>
      <div><span class="lbl">Turno</span><select class="sel${ch(c.turno,r.Turno)}" data-c="turno">${opts(["1º","2º"],c.turno)}</select></div>
      <div><span class="lbl">Acondicionamento</span><select class="sel${ch(c.acond,r.Acondicionamento)}" data-c="acond">${opts(acs,c.acond)}</select></div></div>
      <span class="lbl">Motivo da correção (obrigatório para salvar)</span><textarea class="in" data-c="motivo" placeholder="Ex.: erro de digitação, confirmado na balança">${esc(c.motivo)}</textarea>
      <p class="muted">Borda verde = campo alterado. Cada alteração vira uma linha no HISTÓRICO. <b>Status: ${esc(r.StatusTratado)}</b>${r.ValidadoPor?` · validado por ${esc(r.ValidadoPor)} em ${br(r.DataValidacao)}`:""}</p>
      <div class="g2"><button class="btn sec big" data-act="salvarCorr">Salvar correção</button><button class="btn big" data-act="validar"${r.StatusTratado=="Validado"?" disabled":""}>Validar</button></div></div></div></div>`}
  case "hist":{
    const r=P.trat[UI.reg];const hs=P.hist.filter(h=>h.ID===r.ID).sort((a,b)=>b.DataHora.localeCompare(a.DataHora));
    return header()+`<div class="wrap"><p><button class="btn sec" data-tela="conf">← Voltar à conferência</button> &nbsp; <b style="font-size:18px">Histórico · ${esc(r.Ordem)} · ${brc(r.HoraInicio)}</b></p>
    <div class="tw"><table><thead><tr><th>Data/hora</th><th>Campo</th><th>Antes → depois</th><th>Responsável</th><th>Motivo</th></tr></thead><tbody>
    ${hs.length?hs.map(h=>`<tr><td>${br(h.DataHora)}</td><td><b>${esc(h.Campo)}</b></td><td>${esc(h.ValorAnterior)} → ${esc(h.ValorNovo)}</td><td>${esc(h.Responsavel)}</td><td style="white-space:normal">${esc(h.Motivo)}</td></tr>`).join(""):`<tr><td colspan="5" class="empty">Nenhuma alteração registrada.</td></tr>`}</tbody></table></div></div>`}
  case "pedidos":{const L=pedidos().sort((a,b)=>b.HoraInicio.localeCompare(a.HoraInicio));
    return header()+`<div class="wrap"><div class="tw"><table><thead><tr><th>Ordem</th><th>Hora</th><th>Máquina</th><th class="num">Peso (kg)</th><th>Operador</th><th>Pedido do operador</th></tr></thead><tbody>
    ${L.length?L.map(t=>`<tr class="click" data-reg="${esc(t.ID)}"><td><b>${esc(t.Ordem)}</b></td><td>${brc(t.HoraInicio)}–${hh(t.HoraFim)}</td><td>${esc(t.Maquina)}</td><td class="num">${kg(t.PesoKg)}</td><td>${esc(t.Operador)}</td><td style="white-space:normal">${esc(t.PedidoCorrecao)}</td></tr>`).join(""):`<tr><td colspan="6" class="empty">Nenhum pedido pendente.</td></tr>`}</tbody></table></div></div>`}
  case "paradas":{const f=UI.pf;const L=Object.values(P.par).filter(p=>p.DataProducao>=f.de&&p.DataProducao<=f.ate).sort((a,b)=>b.Inicio.localeCompare(a.Inicio));
    const porMot={};L.forEach(p=>{porMot[p.Motivo]=(porMot[p.Motivo]||0)+p.DuracaoMin});const top=Object.entries(porMot).sort((a,b)=>b[1]-a[1]);
    return header()+`<div class="wrap"><div class="filters"><div class="f"><span class="lbl">De</span><input class="in" type="date" data-pf="de" value="${f.de}"></div><div class="f"><span class="lbl">Até</span><input class="in" type="date" data-pf="ate" value="${f.ate}"></div></div>
    <div class="cards" style="margin-bottom:14px"><div class="box"><h4>Minutos parados por motivo</h4>${top.length?`<table><tbody>${top.map(([m,v])=>`<tr><td>${esc(m)}</td><td class="num"><b>${v}</b> min</td></tr>`).join("")}</tbody></table>`:`<p class="muted">Sem paradas no período.</p>`}</div>
    <div class="box"><h4>Total</h4><p style="font-size:26px;font-weight:700;margin:0">${L.reduce((s,p)=>s+p.DuracaoMin,0)} min</p><p class="muted">${L.length} parada(s) no período</p></div></div>
    <div class="tw"><table><thead><tr><th>Início</th><th>Fim</th><th class="num">Min</th><th>Máquina</th><th>Motivo</th><th>Tipo</th><th>Ordem</th><th>Operador</th><th>Observação</th></tr></thead><tbody>
    ${L.length?L.map(p=>`<tr><td>${brc(p.Inicio)}</td><td>${hh(p.Fim)}</td><td class="num">${p.DuracaoMin}</td><td>${esc(p.Maquina)}</td><td>${esc(p.Motivo)}</td><td>${esc(p.Tipo)}</td><td>${esc(p.Ordem)}</td><td>${esc(p.Operador)}</td><td style="white-space:normal">${esc(p.Observacao)}</td></tr>`).join(""):`<tr><td colspan="9" class="empty">Nenhuma parada.</td></tr>`}</tbody></table></div></div>`}
  case "dados":{
    return header()+`<div class="wrap"><div class="cards">
    <div class="box"><h4>1. Pasta de trabalho</h4><p>Escolha a pasta <b>PRODUÇÃO</b> sincronizada pelo OneDrive (a mesma onde os aparelhos exportam). A Central lê os arquivos dos aparelhos e grava as bases nela.</p>
      <p>Atual: <b>${esc(P.cfg.pastaNome||"nenhuma")}</b></p><button class="btn sec" data-act="escolherPasta">Escolher pasta</button></div>
    <div class="box"><h4>2. Importar lançamentos</h4><p>Lê todos os arquivos <b>LANCAMENTOS_*.csv</b> e <b>PARADAS_*.csv</b> da pasta (procura também nas subpastas). Arquivos já importados são ignorados.</p>
      <button class="btn" data-act="importarPasta">Importar da pasta</button><span class="lbl">ou escolha arquivos manualmente</span><input type="file" id="arqs" multiple accept=".csv" class="in" style="padding-top:6px;width:100%"></div>
    <div class="box"><h4>3. Exportar bases para o Excel</h4><p>Grava na pasta: <b>BASE_BRUTA.csv</b>, <b>BASE_TRATADA.csv</b>, <b>HISTORICO.csv</b>, <b>PARADAS.csv</b> e o backup <b>BACKUP_PCP.json</b>.</p>
      <button class="btn" data-act="exportarBases">Exportar bases</button></div>
    <div class="box"><h4>Situação</h4><p>${Object.keys(P.bruta).length} hora(s) na base · ${Object.keys(P.par).length} parada(s) · ${P.hist.length} alteração(ões) no histórico · ${P.arquivos.length} arquivo(s) importado(s).</p>
      <p class="muted">Responsável nas correções: <b>${esc(P.cfg.nome)}</b> <button class="btn sec" data-act="trocarNome" style="padding:3px 10px">trocar</button></p></div>
    <div class="box"><h4>Cadastros (opcional)</h4><p class="muted">Carregue o <b>cadastros_erp.json</b> para a conferência oferecer todas as máquinas e materiais (sem ele, usa os que já apareceram nos lançamentos). ${P.cfg.cad?`Carregado: ${P.cfg.cad.maq.length} máquinas, ${P.cfg.cad.mat.length} materiais.`:""}</p><input type="file" id="cadArq" accept=".json" class="in" style="padding-top:6px;width:100%"></div>
    <div class="box"><h4>Restaurar backup</h4><p class="muted">Use para continuar o trabalho em outro computador: escolha o <b>BACKUP_PCP.json</b>. Substitui os dados deste navegador.</p><input type="file" id="restaurar" accept=".json" class="in" style="padding-top:6px;width:100%"></div>
    </div></div>`}
  }
}

/* ---------------- ações ---------------- */
const ACT={
  salvarNome(){const n=$("#nome").value.trim();if(!n){toast("Informe seu nome.");return}P.cfg.nome=n;salvar()},
  trocarNome(){P.cfg.nome="";salvar()},
  limparBusca(){UI.f.ordem=""},
  async escolherPasta(){if(!window.showDirectoryPicker){toast("Use Edge ou Chrome no computador para escolher a pasta.");return}
    try{const h=await window.showDirectoryPicker({mode:"readwrite",id:"erp-pcp"});await dbSet("pasta",h);P.cfg.pastaNome=h.name;salvar();toast("Pasta escolhida: "+h.name)}catch(e){}},
  async importarPasta(){let h=await hGet();
    if(!h){if(!window.showDirectoryPicker){toast("Este navegador não lê pastas. Vá em Importar / Exportar e escolha os arquivos manualmente.");UI.tela="dados";return}
      try{h=await window.showDirectoryPicker({mode:"readwrite",id:"erp-pcp"});await dbSet("pasta",h);P.cfg.pastaNome=h.name}catch(e){return}}
    if(!await pastaPerm(h)){toast("Permissão para a pasta negada.");return}
    const files=[];async function varrer(dir,prof){for await(const [nome,ent] of dir.entries()){if(ent.kind==="file"&&/^(LANCAMENTOS|PARADAS)_.*\.csv$/i.test(nome)&&!P.arquivos.includes(nome))files.push(await ent.getFile());else if(ent.kind==="directory"&&prof<2)await varrer(ent,prof+1)}}
    await varrer(h,0);if(!files.length){toast("Nenhum arquivo novo na pasta.");return}await importarArquivos(files)},
  async exportarBases(){
    const cb=["ID","Ordem","DataProducao","Turno","Maquina","Material","HoraInicio","HoraFim","DuracaoMin","PesoKg","Quantidade","Acondicionamento","Observacao","Operador","StatusOrdem","PedidoCorrecao","Aparelho","LancadoEm","Arquivo"];
    const ct=cb.filter(c=>c!=="Arquivo").concat(["StatusTratado","ValidadoPor","DataValidacao"]);
    const ordB=Object.values(P.bruta).sort((a,b)=>a.HoraInicio.localeCompare(b.HoraInicio)),ordT=TRAT().sort((a,b)=>a.HoraInicio.localeCompare(b.HoraInicio));
    let onde=await gravar("BASE_BRUTA.csv",csv(ordB,cb,fmtCell),"text/csv");
    await gravar("BASE_TRATADA.csv",csv(ordT,ct,fmtCell),"text/csv");
    await gravar("HISTORICO.csv",csv(P.hist,["ID","Ordem","Campo","ValorAnterior","ValorNovo","Responsavel","DataHora","Motivo"],fmtCell),"text/csv");
    await gravar("PARADAS.csv",csv(Object.values(P.par),["ID","Ordem","Maquina","Motivo","Tipo","DataProducao","Inicio","Fim","DuracaoMin","Operador","Observacao","Aparelho","LancadoEm"],fmtCell),"text/csv");
    await gravar("BACKUP_PCP.json",JSON.stringify(P),"application/json");
    toast("Bases exportadas → "+(onde=="pasta"?"pasta "+P.cfg.pastaNome:"Downloads"))},
  salvarCorr(){const r=P.trat[UI.reg],c=UI.cf;const pesoAnt=String(r.PesoKg).replace(".",",");
    const mud=[["PesoKg",pesoAnt,c.peso],["Quantidade",String(r.Quantidade??""),c.qtd],["Maquina",r.Maquina,c.maq],["Material",r.Material,c.mat],["Turno",r.Turno,c.turno],["Acondicionamento",r.Acondicionamento,c.acond]].filter(([,a,b])=>String(a)!=String(b));
    if(!mud.length){toast("Nenhuma alteração feita.");return}
    if(!c.motivo.trim()){toast("Informe o motivo da correção.");return}
    if(num(c.peso)<=0){toast("Peso inválido.");return}
    const agora=nowIso();mud.forEach(([campo,a,b])=>P.hist.push({ID:r.ID,Ordem:r.Ordem,Campo:campo,ValorAnterior:a,ValorNovo:b,Responsavel:P.cfg.nome,DataHora:agora,Motivo:c.motivo.trim()}));
    r.PesoKg=num(c.peso);r.Quantidade=c.qtd;r.Maquina=c.maq;r.Material=c.mat;r.Turno=c.turno;r.Acondicionamento=c.acond;r.StatusTratado="Corrigido";
    salvar();UI.cf={};toast(mud.length+" campo(s) corrigido(s) e registrado(s) no histórico.")},
  validar(){const r=P.trat[UI.reg];r.StatusTratado="Validado";r.ValidadoPor=P.cfg.nome;r.DataValidacao=nowIso();salvar();UI.tela="painel";toast("Hora validada.")},
};

/* ---------------- eventos ---------------- */
let rendering=false;
function render(){if(rendering)return;rendering=true;try{$("#app").innerHTML=tela()}finally{rendering=false}}
function chave(el){return el.id||JSON.stringify(el.dataset)}
function suave(){const a=document.activeElement,k=a&&chave(a),s=a&&a.selectionStart;render();const el=[...document.querySelectorAll("input,textarea,select")].find(x=>chave(x)===k);if(el){el.focus();try{if(s!=null)el.setSelectionRange(s,s)}catch(_){}}}
document.addEventListener("click",async e=>{const t=e.target.closest("[data-tela],[data-act],[data-reg],[data-ordem]");if(!t||t.disabled)return;
  if(t.dataset.tela){UI.tela=t.dataset.tela;if(UI.tela!=="hist"&&UI.tela!=="conf")UI.cf={}}
  else if(t.dataset.act){await ACT[t.dataset.act]()}
  else if(t.dataset.reg){UI.reg=t.dataset.reg;UI.cf={};UI.tela="conf"}
  else if(t.dataset.ordem){UI.f.ordem=t.dataset.ordem;UI.tela="painel"}
  render()});
function campo(e){const t=e.target;
  if(t.id==="arqs"&&e.type==="change"){importarArquivos([...t.files]);return}
  if(t.id==="cadArq"&&e.type==="change"){const f=t.files[0];if(!f)return;f.text().then(x=>{try{const v=JSON.parse(x);if(!v.maq||!v.mat)throw 0;P.cfg.cad=v;salvar();toast("Cadastros carregados.");render()}catch(_){toast("Arquivo de cadastros inválido.")}});return}
  if(t.id==="restaurar"&&e.type==="change"){const f=t.files[0];if(!f)return;f.text().then(x=>{try{const v=JSON.parse(x);if(!v.bruta||!v.trat)throw 0;P=v;salvar();toast("Backup restaurado.");render()}catch(_){toast("Arquivo de backup inválido.")}});return}
  let re=e.type==="change";
  if(t.dataset.c!==undefined)UI.cf[t.dataset.c]=t.value;
  else if(t.dataset.ff!==undefined){UI.f[t.dataset.ff]=t.value;re=true}
  else if(t.dataset.pf!==undefined){UI.pf[t.dataset.pf]=t.value;re=true}
  else if(t.id==="fordem")UI.f.ordem=t.value;
  else return;
  re?render():suave()}
document.addEventListener("input",campo);document.addEventListener("change",campo);
(async()=>{try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(_){}
  const v=await dbGet("estado");if(v&&v.bruta)P=v;render()})();
</script>
</body>
</html>
