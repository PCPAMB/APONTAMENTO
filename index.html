<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ERP Produção – Operador</title>
<style>
:root{--lime:#CDFF00;--limeD:#708C00;--limeL:#F3FFCC;--dark:#1C1E1A;--bg:#F5F6F2;--bd:#D6DAD0;--tx:#1C1E1A;--tx2:#686E64;--okL:#D6F0E0;--warn:#E6A800;--warnL:#FFF3CD;--err:#DC3545;--errL:#FFE4E6}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--tx);background:#E9EBE4;display:flex;justify-content:center}
button,input,select,textarea{font:inherit;color:inherit}
.app{width:100%;max-width:520px;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 0 30px rgba(0,0,0,.12)}
.hd{background:var(--dark);color:var(--lime);display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:5px solid var(--lime);min-height:66px;position:sticky;top:0;z-index:2}
.hd .logo{height:22px;width:auto;flex:none}
.hd .t{font-size:20px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{background:none;border:0;color:var(--lime);font-size:26px;cursor:pointer;padding:0 6px 0 0;line-height:1}
.body{flex:1;padding:14px 18px}
.foot{padding:10px 18px 18px;position:sticky;bottom:0;background:var(--bg)}
.lbl{font-size:13px;color:var(--tx2);margin:10px 0 4px}
.in,.sel{width:100%;height:48px;border:1px solid var(--bd);border-radius:8px;background:#fff;padding:0 12px;font-size:17px}
textarea.in{height:auto;min-height:80px;padding:10px 12px;resize:vertical}
.in:focus,.sel:focus{outline:none;border:2px solid var(--limeD)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hm{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btn{width:100%;min-height:58px;border-radius:12px;border:0;background:var(--lime);color:var(--dark);font-size:19px;font-weight:600;cursor:pointer;padding:0 14px}
.btn:hover{filter:brightness(.94)}
.btn:disabled{background:var(--bd);color:var(--tx2);cursor:not-allowed;filter:none}
.btn.sec{background:#fff;border:2px solid var(--dark)}
.btn.big{min-height:96px;font-size:22px;margin-bottom:14px}
.btn.sm{min-height:40px;font-size:15px;width:auto;padding:0 16px}
.btn.warnb{background:var(--warnL);border:2px solid var(--warn)}
.info{background:var(--limeL);border:1px solid var(--limeD);border-radius:8px;padding:10px 12px;font-size:15px;margin-top:10px}
.box{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:10px 12px;font-size:15px}
.warn{background:var(--warnL);border:1px solid var(--warn);border-radius:8px;padding:10px 12px;font-size:14.5px;margin-top:8px}
.card{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:11px 13px;margin-bottom:8px;cursor:pointer}
.card.escolhido{background:var(--limeL);border:3px solid var(--limeD);padding:9px 11px}
.l1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{font-size:12px;padding:3px 10px;border-radius:12px;background:var(--bg);white-space:nowrap}
.chip.on{background:var(--lime)}.chip.cs{background:var(--warnL)}.chip.ok{background:var(--okL)}
.muted{color:var(--tx2);font-size:13.5px}
.big1{font-size:23px;font-weight:600}
.ordem{background:var(--lime);border:2px solid var(--dark);font-size:34px;font-weight:700;padding:14px;margin:8px 0 14px;text-align:center;letter-spacing:1px}
.ok{text-align:center;padding-top:16px}.ok .chk{font-size:64px;color:var(--limeD);line-height:1}
table{width:100%;border-collapse:collapse;background:#fff;font-size:14px;white-space:nowrap}
td,th{padding:9px 8px;border-bottom:1px solid var(--bd);text-align:left}th{font-size:11px;color:var(--tx2);text-transform:uppercase}
.num{text-align:right}
.tw{border:1px solid var(--bd);border-radius:10px;overflow:auto}
.empty{padding:22px;text-align:center;color:var(--tx2)}
.tot{font-size:18px;font-weight:600;margin:10px 0}
.pin{font-size:24px;letter-spacing:8px;-webkit-text-security:disc;text-security:disc}.pin::placeholder{letter-spacing:normal;font-size:16px}
.adm h3{margin:18px 0 6px;font-size:16px}
.adm table input,.adm table select{width:100%;height:36px;border:1px solid var(--bd);border-radius:6px;padding:0 6px;font-size:14px}
.linkbtn{background:none;border:0;color:var(--tx2);text-decoration:underline;cursor:pointer;font-size:13px;padding:6px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--dark);color:var(--lime);padding:11px 18px;border-radius:9px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
.toast.show{opacity:1}
.chip.ok,.chip.cs,.chip.on{padding:3px 10px;text-align:left}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<script src="config.js" onerror="void 0"></script>
<script>
"use strict";
/* ======================================================================
   ERP Produção – App do Operador (versão HTML, sem servidor)
   Os dados ficam guardados neste navegador, neste aparelho.
   No fim do turno, "Exportar turno" grava arquivos CSV na pasta escolhida
   (ex.: a pasta PRODUÇÃO sincronizada pelo OneDrive).
   ====================================================================== */
const CAD0 = {"maq": [], "mat": [], "mot": []};
const ACOND0 = ["BAG","FARDO","PALETE","SACARIA"];
const KEY = "erp-producao-operador-google-v1";
const API_PADRAO = (window.ERP_API||"");
const VERSAO = "1.0";

/* ---------------- armazenamento ---------------- */
function novo(){return {cfg:{dev:"01",adminPin:"",pastaNome:"",api:API_PADRAO,chave:""},users:[],cad:{maq:[],mat:[],mot:[],acond:ACOND0.slice()},cadEm:"",
  seqO:0,seqL:0,seqP:0,ordens:[],lanc:[],paradas:[],exports:[],fila:[],ultimoEnvio:"",erroEnvio:""}}
let S=carregar();
function carregar(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.cfg&&v.lanc){v.fila=v.fila||[];if(!v.cfg.api)v.cfg.api=API_PADRAO;return v}}catch(e){}return novo()}
let storageOk=true;
function salvar(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOk=true}catch(e){storageOk=false;toast("⚠ Não foi possível salvar neste navegador. Exporte agora.")}}

/* pasta de exportação (File System Access API) guardada em IndexedDB */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open("erp-producao-handles",1);r.onupgradeneeded=()=>r.result.createObjectStore("h");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function hGet(k){try{const db=await idb();return await new Promise(r=>{const q=db.transaction("h").objectStore("h").get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
async function hSet(k,v){try{const db=await idb();await new Promise(r=>{const t=db.transaction("h","readwrite");t.objectStore("h").put(v,k);t.oncomplete=r;t.onerror=r})}catch(e){}}

/* ---------------- utilitários ---------------- */
const $=s=>document.querySelector(s);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pad(n,w=2){return String(n).padStart(w,"0")}
function isoD(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function isoDT(d){return isoD(d)+"T"+pad(d.getHours())+":"+pad(d.getMinutes())}
function today(){return isoD(new Date())}
function addDays(iso,n){const d=new Date(iso+"T12:00");d.setDate(d.getDate()+n);return isoD(d)}
function nowIso(){return isoDT(new Date())}
function br(iso){if(!iso)return"";const[a,b]=iso.split("T");const[y,m,d]=a.split("-");return d+"/"+m+"/"+y+(b?" "+b:"")}
function brc(iso){if(!iso)return"";const[a,b]=iso.split("T");const[y,m,d]=a.split("-");return d+"/"+m+(b?" "+b:"")}
function hh(iso){return iso?iso.slice(11,16):""}
function kg(n){return Number(n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}
function num(s){const v=parseFloat(String(s??"").replace(/\./g,"").replace(",","."));return isNaN(v)?0:v}
function mins(a,b){return Math.round((new Date(b)-new Date(a))/60000)}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),3000)}
function opts(list,sel,ph){return (ph!==undefined?`<option value="">${esc(ph)}</option>`:"")+list.map(v=>`<option${v==sel?" selected":""}>${esc(v)}</option>`).join("")}
function hourOpts(sel){return Array.from({length:24},(_,i)=>`<option value="${i}"${i==sel?" selected":""}>${pad(i)}</option>`).join("")}
function minOpts(sel){return Array.from({length:12},(_,i)=>i*5).map(m=>`<option value="${m}"${m==sel?" selected":""}>${pad(m)}</option>`).join("")}
function oprNum(n){return "OPR-"+S.cfg.dev+"-"+pad(n,6)}

/* ---------------- servidor Google ---------------- */
const online=()=>!!(S.cfg.api&&S.cfg.chave);
async function api(body,ms=20000){const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),ms);
  try{const r=await fetch(S.cfg.api,{method:"POST",body:JSON.stringify(Object.assign({k:S.cfg.chave},body)),signal:ctl.signal,redirect:"follow"});
    const j=await r.json();if(!j.ok)throw new Error(j.erro||"Erro no servidor");return j}
  catch(e){if(e.name==="AbortError")throw new Error("Sem resposta do servidor (internet?)");throw e}finally{clearTimeout(t)}}
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function baixarCadastros(avisar){if(!online())return false;
  try{const j=await api({a:"cad"});S.users=j.users.map(u=>Object.assign({ativo:true},u));S.pesoMax=j.pesoMax||3000;S.cad={maq:j.maq,mat:j.mat,mot:j.mot,acond:j.acond.length?j.acond:ACOND0.slice()};S.cadEm=nowIso();salvar();
    if(avisar)toast(`Conectado. ${j.users.length} operador(es), ${j.maq.length} máquinas, ${j.mat.length} materiais.`);return true}
  catch(e){if(avisar)toast("Falha: "+e.message);return false}}
let enviando=false;
function pendentesEnvio(){return S.lanc.filter(l=>!l.sync).length+S.paradas.filter(p=>!p.sync).length+S.fila.length}
async function enviar(manual){if(!online()||enviando)return;const tot=pendentesEnvio();if(!tot){if(manual)toast("Tudo já foi enviado ✓");return}
  enviando=true;const Lp=S.lanc.filter(l=>!l.sync),Pp=S.paradas.filter(p=>!p.sync);const L=Lp.slice(0,150),P=Pp.slice(0,150);
  const enc=Lp.length>150?[]:S.fila.filter(f=>f.t==="enc"),ped=S.fila.filter(f=>f.t==="ped");
  try{const j=await api({a:"sync",lanc:L.map(l=>Object.assign({},l,{dev:S.cfg.dev})),par:P.map(p=>Object.assign({},p,{dev:S.cfg.dev,tipo:(S.cad.mot.find(m=>m[0]===p.mot)||[])[1]||""})),enc:enc,ped:ped},30000);
    const a=j.ack;const sl=new Set(a.lanc),sp=new Set(a.par),se=new Set(a.enc),sq=new Set(a.ped);
    S.lanc.forEach(l=>{if(sl.has(l.id))l.sync=true});S.paradas.forEach(p=>{if(sp.has(p.id))p.sync=true});
    S.fila=S.fila.filter(f=>!(f.t==="enc"&&se.has(f.ordem))&&!(f.t==="ped"&&sq.has(f.id)));
    S.ultimoEnvio=nowIso();S.erroEnvio="";salvar();if(manual)toast("Enviado ✓");}
  catch(e){S.erroEnvio=e.message;salvar();if(manual)toast("Não enviou: "+e.message)}
  finally{enviando=false;if(["login","ordem","meus","admin"].includes(UI.tela))suave()}}
setInterval(()=>enviar(false),30000);window.addEventListener("online",()=>enviar(false));
async function sincronizarOrdem(u){/* a ordem aberta pode ter sido começada em outro aparelho */
  if(!online())return;try{const j=await api({a:"ordemAberta",uid:u.id},8000);
    if(j.ordem){let o=S.ordens.find(x=>x.num===j.ordem.num);if(!o){o=Object.assign({},j.ordem,{total:0,horas:0});S.ordens.push(o)}o.status="Aberta";
      j.linhas.forEach(l=>{if(!S.lanc.some(x=>x.id===l.id))S.lanc.push(l)});}
    else{S.ordens.filter(o=>o.uid===u.id&&o.status==="Aberta"&&!S.fila.some(f=>f.t==="enc"&&f.ordem===o.num)).forEach(o=>o.status="Encerrada")}
    salvar()}catch(e){}}

/* ---------------- estado da tela ---------------- */
let UI={tela:"login",u:null,sel:null,pin:"",busca:"",form:{},h:{},par:{},meusSel:null,pedido:"",buscaMeus:"",confEnc:false,ultima:null,admOk:false,admPin:"",admTab:"op"};
function user(){return S.users.find(x=>x.id===UI.u)}
function ordemAberta(uid){const id=uid??UI.u;return S.ordens.filter(o=>o.uid===id&&o.status==="Aberta").sort((a,b)=>b.n-a.n)[0]}
function linhasDe(o){return S.lanc.filter(l=>l.ordem===o.num).sort((a,b)=>b.ini.localeCompare(a.ini))}
function pendentes(){return {l:S.lanc.filter(l=>!l.exp).length,p:S.paradas.filter(p=>!p.exp).length}}

/* hora do lançamento: data da ordem + h:min; se ficar mais de 12 h antes da abertura, é do dia seguinte */
function horaOrdem(o,h){let i0=o.data+"T"+pad(h.hi)+":"+pad(h.mi);const f0=o.data+"T"+pad(h.hf)+":"+pad(h.mf);
  let dur=mins(i0,f0);if(dur<0)dur+=1440;
  if(new Date(i0)<new Date(new Date(o.abertura).getTime()-720*60000))i0=addDays(o.data,1)+i0.slice(10);
  const f=new Date(new Date(i0).getTime()+dur*60000);return{ini:i0,fim:isoDT(f),dur}}
function span(data,hi,mi,hf,mf){const ini=data+"T"+pad(hi)+":"+pad(mi);let fd=data;if(+hf*60+ +mf< +hi*60+ +mi)fd=addDays(data,1);const fim=fd+"T"+pad(hf)+":"+pad(mf);return{ini,fim,dur:mins(ini,fim)}}

/* ---------------- telas ---------------- */
function hd(t,back,extra){return `<div class="hd">${back?`<button class="back" data-go="${back}" aria-label="Voltar">←</button>`:`<img class="logo" src="logo.png" alt="Ambipar" onerror="this.remove()">`}<div class="t">${esc(t)}</div>${extra||""}</div>`}
const SAIR=`<button class="btn sm" data-act="sair">Sair</button>`;

function tela(){
  const u=user();if(!u&&!["login","admin"].includes(UI.tela))UI.tela="login";
  switch(UI.tela){
  case "login":{
    const q=UI.busca.trim().toLowerCase();const us=S.users.filter(x=>x.ativo&&(!q||x.nome.toLowerCase().includes(q))).sort((a,b)=>a.nome.localeCompare(b.nome));
    const sel=S.users.find(x=>x.id===UI.sel);const pend=pendentes();const abertas=S.ordens.filter(o=>o.status==="Aberta");
    return hd("Quem está lançando?")+`<div class="body">
    ${!online()||!S.users.length?`<div class="warn">Aparelho ainda não configurado. Procure o responsável.</div>`:""}
    <input class="in" id="busca" type="search" readonly onfocus="this.removeAttribute('readonly')" name="erp-busca-nome" autocomplete="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore value="${esc(UI.busca)}" placeholder="Buscar meu nome" style="margin-bottom:10px">
    ${S.users.some(x=>x.dup)?`<div class="warn">ID repetido na planilha (aba CAD_Usuarios): ${esc([...new Set(S.users.filter(x=>x.dup).map(x=>x.id))].join(", "))}. Cada colaborador precisa de um ID diferente. Esses nomes ficam bloqueados até corrigir.</div>`:""}
    ${us.map(x=>x.dup?`<div class="card" style="opacity:.55;cursor:not-allowed"><div class="l1"><span><b style="font-size:17px">${esc(x.nome)}</b><br><span class="muted">ID ${esc(x.id)} repetido — avise o responsável</span></span></div></div>`:`<div class="card${x.id===UI.sel?" escolhido":""}" data-sel="${x.id}"><div class="l1"><span><b style="font-size:17px">${esc(x.nome)}</b><br><span class="muted">Turno ${esc(x.turno)}</span></span>${ordemAberta(x.id)?`<span class="chip on">Ordem aberta</span>`:""}</div></div>`).join("")}
    <div class="lbl">${sel?"PIN de "+esc(sel.nome):"Toque no seu nome"}</div>
    <input class="in pin" id="pin" type="text" readonly onfocus="this.removeAttribute('readonly')" inputmode="numeric" maxlength="4" autocomplete="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore value="${esc(UI.pin)}" placeholder="PIN (4 dígitos)">
    ${online()?`<div class="box" style="margin-top:16px">${pendentesEnvio()?`<b>⏳ ${pendentesEnvio()} item(ns) aguardando internet</b><div class="muted" style="margin:4px 0 8px">Ficam guardados neste aparelho e são enviados sozinhos quando a internet voltar.${S.erroEnvio?" ("+esc(S.erroEnvio)+")":""}</div><button class="btn sec" data-act="enviarAgora">Enviar agora</button>`:`<b>✓ Tudo enviado</b><div class="muted">${S.ultimoEnvio?"Último envio: "+br(S.ultimoEnvio):"Lançamentos vão direto para o servidor."}${abertas.length?` · ${abertas.length} ordem(ns) aberta(s) neste aparelho`:""}</div>`}</div>`:""}
    <div style="text-align:center;margin-top:10px"><button class="linkbtn" data-go="admin">${S.cfg.adminPin?"Administração":"Configurar este aparelho"}</button></div></div>
    <div class="foot"><button class="btn" data-act="entrar"${sel&&UI.pin.length===4?"":" disabled"}>Entrar</button></div>`}
  case "inicio":{
    const o=ordemAberta();const hoje=S.lanc.filter(l=>l.uid===u.id&&l.data===today()).length;
    return hd("ERP Produção",null,SAIR)+`<div class="body"><div class="big1">Olá, ${esc(u.nome)}</div><div class="muted" style="margin-bottom:14px">Turno ${esc(u.turno)} · ${br(today())}</div>
    <div class="${o?"info":"box"}" style="margin:0 0 6px">${o?`Ordem aberta: <b>${o.num}</b><br>${esc(o.maq)} · Turno ${esc(o.turno)} · ${brc(o.data)}`:"Nenhuma ordem aberta"}</div>
    ${o&&o.data<today()?`<div class="warn">⚠ Esta ordem é de outro dia. Encerre e abra uma nova.</div>`:""}
    <button class="btn big" style="margin-top:12px" data-go="${o?"ordem":"abrir"}">${o?"Lançar hora na "+o.num:"Abrir ordem de processo"}</button>
    <button class="btn big sec" data-go="parada">Registrar parada</button>
    <button class="btn big sec" data-go="meus">Meus lançamentos</button>
    <p class="muted" style="text-align:center">Hoje: ${hoje} hora(s) lançada(s)</p></div>`}
  case "abrir":{
    const f=UI.form;f.data??=today();f.turno??=u.turno;f.maq??="";f.mat??="";const ok=f.turno&&f.maq&&f.mat;
    return hd("Abrir ordem de processo","inicio")+`<div class="body">
    <div class="lbl">Data da produção</div><input class="in" type="date" data-f="data" value="${f.data}">
    <div class="lbl">Turno *</div><select class="sel" data-f="turno">${opts(["1º","2º"],f.turno,"")}</select>
    <div class="lbl">Máquina *</div><select class="sel" data-f="maq">${opts(S.cad.maq,f.maq,"Selecione…")}</select>
    <div class="lbl">Material *</div><select class="sel" data-f="mat">${opts(S.cad.mat,f.mat,"Selecione…")}</select>
    <div class="info" style="margin-top:16px">Uma ordem por máquina e turno. O número é gerado agora e vale para todas as horas que você lançar até encerrar a ordem no fim do turno.</div></div>
    <div class="foot"><button class="btn" data-act="abrirOrdem"${ok&&!UI.abrindo?"":" disabled"}>${UI.abrindo?"Abrindo ordem…":"Abrir ordem"}</button></div>`}
  case "ordem":{
    const o=ordemAberta();if(!o){UI.tela="inicio";return tela()}
    const L=linhasDe(o);const h=UI.h;
    if(h.hi===undefined){if(L.length){h.hi=+hh(L[0].fim).slice(0,2);h.mi=+hh(L[0].fim).slice(3)}else{h.hi=new Date().getHours();h.mi=0}h.hf=(h.hi+1)%24;h.mf=h.mi}
    h.peso??="";h.qtd??="";h.acond??=(L[0]&&L[0].acond)||"";h.obs??="";
    const sp=horaOrdem(o,h);const dup=L.some(l=>l.ini===sp.ini);const tot=L.reduce((s,l)=>s+l.peso,0);
    return hd("Ordem "+o.num,"inicio",SAIR)+`<div class="body">
    <div class="info" style="margin-top:0">${esc(o.maq)} · Turno ${esc(o.turno)} · ${brc(o.data)}<br>${esc(o.mat)}</div>
    <div class="tot">Lançado: ${L.length} hora(s) · ${kg(tot)} kg</div>
    <div class="row2"><div><div class="lbl">Hora início (h : min)</div><div class="hm"><select class="sel" data-h="hi">${hourOpts(h.hi)}</select><select class="sel" data-h="mi">${minOpts(h.mi)}</select></div></div>
    <div><div class="lbl">Hora fim (h : min)</div><div class="hm"><select class="sel" data-h="hf">${hourOpts(h.hf)}</select><select class="sel" data-h="mf">${minOpts(h.mf)}</select></div></div></div>

  case "meus":{

/* ---------------- exportação ---------------- */
function csvCell(v){v=String(v??"");return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function csv(rows,cols){return "﻿"+cols.join(";")+"\r\n"+rows.map(r=>cols.map(c=>csvCell(r[c])).join(";")).join("\r\n")+"\r\n"}
const COLS_L=["ID","Ordem","DataProducao","Turno","Maquina","Material","HoraInicio","HoraFim","DuracaoMin","PesoKg","Quantidade","Acondicionamento","Observacao","Operador","StatusOrdem","PedidoCorrecao","Aparelho","LancadoEm"];
const COLS_P=["ID","Ordem","Maquina","Motivo","Tipo","DataProducao","Inicio","Fim","DuracaoMin","Operador","Observacao","Aparelho","LancadoEm"];
function linhaL(l){const o=S.ordens.find(x=>x.num===l.ordem)||{};return{ID:l.id,Ordem:l.ordem,DataProducao:br(l.data),Turno:l.turno,Maquina:l.maq,Material:l.mat,HoraInicio:br(l.ini),HoraFim:br(l.fim),DuracaoMin:l.dur,
  PesoKg:String(l.peso).replace(".",","),Quantidade:l.qtd,Acondicionamento:l.acond,Observacao:l.obs,Operador:l.nome,StatusOrdem:o.status||"",PedidoCorrecao:l.pedido||"",Aparelho:S.cfg.dev,LancadoEm:br(l.criado)}}
function linhaP(p){const t=(S.cad.mot.find(m=>m[0]===p.mot)||[])[1]||"";return{ID:p.id,Ordem:p.ordem,Maquina:p.maq,Motivo:p.mot,Tipo:t,DataProducao:br(p.data),Inicio:br(p.ini),Fim:br(p.fim),DuracaoMin:p.dur,Operador:p.nome,Observacao:p.obs,Aparelho:S.cfg.dev,LancadoEm:br(p.criado)}}
async function gravar(nome,conteudo){
  const handle=await hGet("pasta");
  if(handle&&handle.getFileHandle){try{
    let perm=await handle.queryPermission({mode:"readwrite"});if(perm!=="granted")perm=await handle.requestPermission({mode:"readwrite"});
    if(perm==="granted"){const fh=await handle.getFileHandle(nome,{create:true});const w=await fh.createWritable();await w.write(new Blob([conteudo],{type:"text/csv"}));await w.close();return "pasta"}
  }catch(e){console.warn(e)}}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([conteudo],{type:"text/csv;charset=utf-8"}));a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);return "downloads";
}
async function exportar(tudo){
  const L=S.lanc.filter(l=>tudo||!l.exp),P=S.paradas.filter(p=>tudo||!p.exp);
  if(!L.length&&!P.length){toast("Nada novo para exportar.");return}
  const d=new Date();const stamp=isoD(d)+"_"+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds());const base="AP"+S.cfg.dev+"_"+stamp;
  let onde="";
  if(L.length)onde=await gravar("LANCAMENTOS_"+base+".csv",csv(L.map(linhaL),COLS_L));
  if(P.length)onde=await gravar("PARADAS_"+base+".csv",csv(P.map(linhaP),COLS_P));
  S.exports.push({quando:nowIso(),arquivo:base,linhas:L.length+P.length});limpar();salvar();
  toast(`Exportado: ${L.length} hora(s) e ${P.length} parada(s) → ${onde=="pasta"?"pasta "+(S.cfg.pastaNome||""):"Downloads"}`);render();
}
function limpar(){const lim=addDays(today(),-60);S.lanc=S.lanc.filter(l=>!(l.sync&&l.data<lim));S.paradas=S.paradas.filter(p=>!(p.sync&&p.data<lim));
  S.ordens=S.ordens.filter(o=>o.status==="Aberta"||o.data>=lim)}

/* ---------------- ações ---------------- */
const ACT={
  async entrar(){const x=S.users.find(y=>y.id===UI.sel&&!y.dup);if(!x){return}
    let ok=false;try{ok=(await sha(x.id+":"+UI.pin))===x.ph}catch(e){toast("Este navegador não suporta o login seguro. Use https.");return}
    if(!ok){toast("PIN incorreto.");UI.pin="";return}
    UI.u=x.id;UI.sel=null;UI.pin="";UI.busca="";UI.form={};UI.h={};UI.meusSel=null;UI.pedido="";
    await sincronizarOrdem(x);UI.tela=ordemAberta()?"ordem":"inicio";toast("Olá, "+x.nome.split(" ")[0]+"!");enviar(false)},
  limparAparelho(){if(!UI.confLimpar){UI.confLimpar=true;setTimeout(()=>{UI.confLimpar=false;suave()},5000);return}
    UI.confLimpar=false;const antes=S.lanc.length+S.paradas.length;
    const pendOrd=new Set(S.lanc.filter(l=>!l.sync).map(l=>l.ordem).concat(S.paradas.filter(p=>!p.sync).map(p=>p.ordem)).concat(S.fila.map(f=>f.ordem).filter(Boolean)));
    S.lanc=S.lanc.filter(l=>!l.sync);S.paradas=S.paradas.filter(p=>!p.sync);S.ordens=S.ordens.filter(x=>pendOrd.has(x.num)||!x.num);
    salvar();toast((antes-S.lanc.length-S.paradas.length)+" registro(s) apagado(s) deste aparelho.")},
  sair(){UI.u=null;UI.tela="login";UI.confEnc=false;UI.h={};UI.form={};UI.par={};toast("Aparelho liberado para o próximo colaborador.")},
  async abrirOrdem(){const u=user(),f=UI.form;if(UI.abrindo)return;UI.abrindo=true;suave();
    try{const j=await api({a:"abrir",ordem:{tmp:Date.now(),uid:u.id,nome:u.nome,data:f.data,turno:f.turno,maq:f.maq,mat:f.mat,dev:S.cfg.dev}},20000);
      S.seqO++;const o=Object.assign({n:S.seqO,total:0,horas:0,encerramento:""},j.ordem);if(!S.ordens.some(x=>x.num===o.num))S.ordens.push(o);
      salvar();UI.form={};UI.h={};UI.tela="ordem";toast("Ordem "+o.num+" aberta.")}
    catch(e){toast("Não foi possível abrir a ordem: "+e.message+". Verifique o wifi e tente de novo.")}
    finally{UI.abrindo=false}},
  lancar(){const u=user(),o=ordemAberta(),h=UI.h,sp=horaOrdem(o,h);S.seqL++;
    S.lanc.push({id:S.cfg.dev+"-L"+pad(S.seqL,6)+"-"+Date.now().toString(36),ordem:o.num,uid:u.id,nome:u.nome,data:o.data,turno:o.turno,maq:o.maq,mat:o.mat,ini:sp.ini,fim:sp.fim,dur:sp.dur,peso:num(h.peso),qtd:h.qtd?parseInt(h.qtd,10):"",acond:h.acond,obs:h.obs,criado:nowIso(),sync:false,pedido:""});
    salvar();enviar(false);toast("Hora "+hh(sp.ini)+"–"+hh(sp.fim)+" lançada: "+h.peso+" kg");UI.h={acond:h.acond};UI.confEnc=false},
  encerrar(){if(!UI.confEnc){UI.confEnc=true;return}const o=ordemAberta();const L=linhasDe(o);o.status="Encerrada";o.encerramento=nowIso();o.total=L.reduce((s,l)=>s+l.peso,0);o.horas=L.length;
    S.fila.push({t:"enc",ordem:o.num,quando:o.encerramento});
    salvar();enviar(false);UI.confEnc=false;UI.ultima=o.num;UI.tela="encerrada"},
  salvarParada(){const u=user(),p=UI.par,sp=span(p.data,p.hi,p.mi,p.hf,p.mf),oa=ordemAberta();S.seqP++;
    S.paradas.push({id:S.cfg.dev+"-P"+pad(S.seqP,6)+"-"+Date.now().toString(36),ordem:oa?oa.num:"",uid:u.id,nome:u.nome,maq:p.maq,mot:p.mot,data:p.data,ini:sp.ini,fim:sp.fim,dur:sp.dur,obs:p.obs,criado:nowIso(),sync:false});
    salvar();enviar(false);UI.par={};UI.tela="inicio";toast("Parada registrada.")},
  pedir(){const l=S.lanc.find(x=>x.id===UI.meusSel);l.pedido=UI.pedido.trim();S.fila.push({t:"ped",id:l.id,texto:l.pedido});salvar();enviar(false);UI.pedido="";toast("Pedido enviado ao PCP.")},
  enviarAgora(){return enviar(true)},
  atualizarCad(){return baixarCadastros(true)},
  exportar(){exportar(false)},
  exportarTudo(){exportar(true)},
  admEntrar(){if(UI.admPin===S.cfg.adminPin){UI.admOk=true;UI.admPin="";if(S.cfg.adminPin==="0000"){UI.admTab="cfg";toast("Troque o PIN do administrador (0000).")}}else{toast("PIN incorreto.");UI.admPin=""}},
  admCriar(){const a=($("#admNovo1")||{}).value||"",b=($("#admNovo2")||{}).value||"";
    if(!/^\d{4,8}$/.test(a)){toast("O PIN deve ter de 4 a 8 números.");return}if(a!==b){toast("Os dois PINs não são iguais.");return}
    if(a==="0000"||a==="1234"){toast("Escolha um PIN menos óbvio.");return}
    S.cfg.adminPin=a;salvar();UI.admOk=true;UI.admTab="cfg";toast("PIN criado. Agora informe o servidor e a chave.")},
  addUser(){S.users.push({id:"u"+Date.now(),nome:"Novo operador",turno:"1º",pin:"",ativo:true});salvar()},
  salvarCad(){const g=k=>document.querySelector(`[data-cad="${k}"]`).value.split("\n").map(s=>s.trim()).filter(Boolean);
    S.cad.maq=g("maq");S.cad.mat=g("mat");S.cad.acond=g("acond");S.cad.mot=g("mot").map(s=>{const[a,b]=s.split(";");return[a.trim(),(b||"").trim()]});salvar();toast("Cadastros salvos.")},
  async salvarCfg(){const g=k=>document.querySelector(`[data-cfg="${k}"]`).value.trim();const dev=g("dev").toUpperCase().replace(/[^A-Z0-9]/g,""),pin=g("adminPin");
    if(!dev){toast("Informe o código do aparelho.");return}if(pin.length<4){toast("PIN do administrador com pelo menos 4 dígitos.");return}
    if(!/^https:\/\/script\.google\.com\//.test(g("api"))&&!/^http:\/\/localhost/.test(g("api"))){toast("Endereço do servidor inválido (deve começar com https://script.google.com/).");return}
    S.cfg.dev=dev;S.cfg.adminPin=pin;S.cfg.api=g("api");S.cfg.chave=g("chave");salvar();await baixarCadastros(true)},
  async escolherPasta(){if(!window.showDirectoryPicker){toast("Este navegador não permite escolher pasta. Use Edge ou Chrome no computador; os arquivos irão para Downloads.");return}
    try{const h=await window.showDirectoryPicker({mode:"readwrite",id:"erp-export"});await hSet("pasta",h);S.cfg.pastaNome=h.name;salvar();toast("Pasta escolhida: "+h.name);render()}catch(e){}},
  backup(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="BACKUP_OPERADOR_AP"+S.cfg.dev+"_"+today()+".json";document.body.appendChild(a);a.click();a.remove()},
};

/* ---------------- eventos ---------------- */
let rendering=false;
function render(){if(rendering)return;rendering=true;try{$("#app").innerHTML=tela()}finally{rendering=false}}
function chave(el){return el.id||JSON.stringify(el.dataset)}
function suave(){const a=document.activeElement,k=a&&chave(a),s=a&&a.selectionStart;render();
  const el=[...document.querySelectorAll("input,textarea,select")].find(x=>chave(x)===k);if(el){el.focus();try{if(s!=null)el.setSelectionRange(s,s)}catch(_){}}}
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-go],[data-act],[data-sel],[data-meus],[data-admtab]");if(!t||t.disabled)return;
  if(t.dataset.go){UI.tela=t.dataset.go;UI.confEnc=false;if(t.dataset.go=="abrir")UI.form={};if(t.dataset.go=="ordem")UI.h={};if(t.dataset.go=="meus"){UI.meusSel=null;UI.pedido=""}if(t.dataset.go=="login")UI.admOk=false}
  else if(t.dataset.act){await ACT[t.dataset.act]()}
  else if(t.dataset.sel){UI.sel=t.dataset.sel;UI.pin=""}
  else if(t.dataset.meus){UI.meusSel=t.dataset.meus}
  else if(t.dataset.admtab){UI.admTab=t.dataset.admtab}
  render();
});
function campo(e){const t=e.target;
  if(e.type==="input"&&["busca","pin","admPin","buscaMeus"].includes(t.id)&&document.activeElement!==t){const v={busca:UI.busca,pin:UI.pin,admPin:UI.admPin,buscaMeus:UI.buscaMeus}[t.id];t.value=v===undefined?"":v;return}
  if(t.id==="cadArq"&&e.type==="change"){const f=t.files[0];if(!f)return;f.text().then(x=>{try{const v=JSON.parse(x);if(!v.maq||!v.mat||!v.mot)throw 0;
    S.cad.maq=v.maq;S.cad.mat=v.mat;S.cad.mot=v.mot;if(v.acond)S.cad.acond=v.acond;salvar();toast(`Cadastros carregados: ${v.maq.length} máquinas, ${v.mat.length} materiais, ${v.mot.length} motivos.`);render()}catch(_){toast("Arquivo de cadastros inválido.")}});return}
  if(t.id==="restaurar"&&e.type==="change"){const f=t.files[0];if(!f)return;f.text().then(x=>{try{const v=JSON.parse(x);if(!v.cfg||!v.lanc)throw 0;S=v;salvar();toast("Backup restaurado.");render()}catch(_){toast("Arquivo de backup inválido.")}});return}
  if(t.dataset.u){const x=S.users.find(y=>y.id===t.dataset.u);if(t.dataset.k==="ativo")x.ativo=t.checked;else if(t.dataset.k==="pin")x.pin=t.value.replace(/\D/g,"").slice(0,4);else x[t.dataset.k]=t.value;
    if(e.type==="change"){const pins=S.users.filter(y=>y.ativo&&y.pin).map(y=>y.pin);if(new Set(pins).size!==pins.length)toast("⚠ Há PINs repetidos entre operadores.");salvar()}return}
  if(t.dataset.cad||t.dataset.cfg)return;
  let re=e.type==="change";
  if(t.dataset.f!==undefined)UI.form[t.dataset.f]=t.value;
  else if(t.dataset.h!==undefined){UI.h[t.dataset.h]=t.value;UI.confEnc=false;if(t.dataset.h==="hi")UI.h.hf=(+t.value+1)%24;if(t.dataset.h==="mi")UI.h.mf=+t.value}
  else if(t.dataset.p!==undefined)UI.par[t.dataset.p]=t.value;
  else if(t.id==="busca")UI.busca=t.value;
  else if(t.id==="pin")UI.pin=t.value.replace(/\D/g,"").slice(0,4);
  else if(t.id==="buscaMeus")UI.buscaMeus=t.value;
  else if(t.id==="pedido")UI.pedido=t.value;
  else if(t.id==="admPin")UI.admPin=t.value;
  else return;
  re?render():suave();
}
document.addEventListener("input",campo);document.addEventListener("change",campo);
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.target.id==="pin"||e.target.id==="admPin")){const b=document.querySelector('[data-act="entrar"],[data-act="admEntrar"]');if(b&&!b.disabled)b.click()}});
window.addEventListener("beforeunload",e=>{if(S.ordens.some(o=>o.status==="Aberta")||pendentes().l){/* dados ficam salvos; aviso só informativo */}});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(_){}
render();
setInterval(()=>{if(UI.tela!=="login")return;const b=document.getElementById("busca"),p=document.getElementById("pin");
  if(b&&document.activeElement!==b&&b.value!==UI.busca)b.value=UI.busca;if(p&&document.activeElement!==p&&p.value!==UI.pin)p.value=UI.pin},700);
if(online()){baixarCadastros(false).then(()=>{if(UI.tela==="login")suave()});enviar(false)}
setInterval(()=>{if(online()&&UI.tela==="login"&&!document.hidden)baixarCadastros(false).then(()=>{if(UI.tela==="login")suave()})},20*60000);
</script>
</body>
